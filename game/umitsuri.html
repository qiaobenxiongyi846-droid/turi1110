<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海釣り</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b2a4a; font-family: "Hiragino Sans", "Meiryo", "Yu Gothic", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #wrap { position: relative; width: 800px; max-width: 100vw; aspect-ratio: 800 / 520; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 10px; cursor: pointer; background: #cfe9ff; }
  .overlay {
    position: absolute; inset: 0; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(10, 50, 100, 0.82); color: #fff; text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: clamp(32px, 7vw, 56px); letter-spacing: 0.15em; }
  .overlay p { margin: 0; font-size: clamp(13px, 2.2vw, 17px); line-height: 1.8; color: #d6ebff; }
  .overlay button {
    margin-top: 8px; padding: 12px 44px; font-size: 20px; font-weight: bold; color: #0b4a8a;
    background: #fff; border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 4px 0 #8fc4f0; transition: transform .08s, box-shadow .08s;
  }
  .overlay button:active { transform: translateY(3px); box-shadow: 0 1px 0 #8fc4f0; }
  .big { font-size: clamp(40px, 9vw, 72px); font-weight: bold; }
  .rank { font-size: clamp(18px, 3.5vw, 26px); color: #ffe27a; font-weight: bold; }
  .row { display: flex; gap: 14px; align-items: center; justify-content: center; }
  .overlay button.sub {
    background: transparent; color: #fff; border: 2px solid #fff; box-shadow: none; padding: 10px 30px;
  }
  .overlay button.sub:active { transform: translateY(2px); }

  /* BGMのオン・オフ */
  .mute {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(8, 40, 90, 0.6); color: #fff; font-size: 17px; line-height: 38px; padding: 0;
  }
  .mute:hover { background: rgba(8, 40, 90, 0.85); }

  /* 図鑑 */
  .zukan {
    position: absolute; inset: 0; border-radius: 10px; padding: 14px 16px; z-index: 5;
    display: flex; flex-direction: column; gap: 10px;
    background: rgba(8, 36, 78, 0.97); color: #fff;
  }
  .zukan.hidden { display: none; }
  .zhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .zhead h2 { margin: 0; font-size: clamp(20px, 4vw, 28px); letter-spacing: 0.2em; }
  .zcount { font-size: clamp(14px, 2.6vw, 18px); color: #ffe27a; font-weight: bold; }
  .ztabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .ztabs button {
    padding: 6px 16px; font-size: 14px; font-weight: bold; color: #fff; cursor: pointer;
    background: rgba(255,255,255,0.12); border: 2px solid transparent; border-radius: 999px;
  }
  .ztabs button.active { background: #fff; color: #0b4a8a; }
  .zgrid {
    flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-right: 4px;
    grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
  }
  .zcard {
    background: rgba(255,255,255,0.09); border-radius: 10px; padding: 6px 4px 8px; text-align: center;
    font-size: 12px; line-height: 1.4;
  }
  .zcard canvas { width: 100%; height: auto; display: block; }
  .zcard.got { background: rgba(255,255,255,0.18); }
  .zcard.rare.got { background: rgba(255,210,58,0.28); box-shadow: 0 0 0 2px #ffd23a inset; }
  .zcard .zn { font-weight: bold; font-size: 13px; }
  .zcard .zc { color: #ffe27a; }
  .zcard.none { color: #86a6cc; }
  .zhint { font-size: 12px; color: #9fbbe0; margin-top: -4px; }
  .zcard { cursor: pointer; transition: transform .08s; }
  .zcard:hover { transform: translateY(-2px); }
  .zdetail {
    position: absolute; inset: 0; border-radius: 10px; z-index: 6; padding: 18px 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: #082450; color: #fff; text-align: center;
  }
  .zdetail.hidden { display: none; }
  .zdetail canvas { width: min(300px, 70%); height: auto; background: rgba(255,255,255,0.1); border-radius: 12px; }
  .zdetail.rare canvas { background: rgba(255,210,58,0.22); box-shadow: 0 0 0 2px #ffd23a inset; }
  #zdName { font-size: clamp(24px, 5vw, 34px); font-weight: bold; letter-spacing: 0.1em; }
  #zdTags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #zdTags span { background: rgba(255,255,255,0.16); border-radius: 999px; padding: 3px 12px; font-size: 13px; }
  #zdText { margin: 0; max-width: 520px; font-size: clamp(14px, 2.4vw, 17px); line-height: 1.9; color: #e2f0ff; }
  .zdetail button {
    margin-top: 6px; padding: 8px 34px; font-size: 16px; font-weight: bold; cursor: pointer;
    border: none; border-radius: 999px; background: #fff; color: #0b4a8a;
  }
  .zfoot { display: flex; justify-content: space-between; align-items: center; }
  .zfoot button {
    padding: 8px 28px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 999px;
    border: none; background: #fff; color: #0b4a8a;
  }
  .zfoot button.reset { background: transparent; color: #9fbbe0; font-size: 12px; font-weight: normal; padding: 4px 8px; text-decoration: underline; }

  /* 縦向きの画面：図鑑・詳細は画面全体に表示（ゲーム画面が小さくなるため） */
  @media (orientation: portrait) and (max-width: 800px) {
    .zukan { position: fixed; inset: 0; width: 100%; height: 100vh; height: 100dvh; border-radius: 0; padding: 12px 12px; }
    .zgrid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); -webkit-overflow-scrolling: touch; }
    .zdetail { border-radius: 0; overflow-y: auto; justify-content: flex-start; padding: 28px 18px 24px; }
    .zdetail canvas { width: min(300px, 80%); flex: none; }
    .zdetail button { flex: none; margin-bottom: 8px; }
    .zcard .zn { font-size: 12px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="520"></canvas>
  <button id="muteBtn" class="mute" title="BGM オン／オフ（Mキー）" aria-label="BGM オン／オフ">🔊</button>

  <div id="startScreen" class="overlay">
    <h1>海 釣 り</h1>
    <p>より大きな魚を釣ろう！<br>深く投げるほど大きな魚がいるけれど、引き上げるのは難しくなる。<br>全部で5投。合計スコアを伸ばそう。</p>
    <p style="font-size:13px">大 = 15点 ／ 中 = 10点 ／ 小 = 5点<br>どの深さにも、たまに「幻の魚」が現れる…？（100点）</p>
    <div class="row">
      <button id="startBtn">スタート</button>
      <button id="zukanBtn1" class="sub">図鑑</button>
    </div>
  </div>

  <div id="resultScreen" class="overlay hidden">
    <h1 style="font-size:clamp(24px,5vw,38px)">結 果</h1>
    <div class="big"><span id="finalScore">0</span><span style="font-size:.4em"> 点</span></div>
    <div class="rank" id="rankText"></div>
    <p id="detailText"></p>
    <div class="row">
      <button id="retryBtn">もう一度</button>
      <button id="zukanBtn2" class="sub">図鑑</button>
    </div>
  </div>

  <div id="zukanScreen" class="zukan hidden">
    <div class="zhead">
      <h2>魚 図 鑑</h2>
      <div class="zcount">登録 <span id="zukanCount">0 / 0</span></div>
    </div>
    <div class="ztabs" id="zukanTabs"></div>
    <div class="zhint">魚のカードをクリックすると、くわしい説明が見られます</div>
    <div class="zgrid" id="zukanGrid"></div>
    <div class="zfoot">
      <button id="zukanReset" class="reset">図鑑の記録を消す</button>
      <button id="zukanClose">閉じる</button>
    </div>

    <div id="zukanDetail" class="zdetail hidden">
      <canvas id="zdCanvas" width="300" height="180"></canvas>
      <div id="zdName"></div>
      <div id="zdTags"></div>
      <p id="zdText"></p>
      <button id="zdBack">もどる</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  let ctx = cv.getContext('2d'); // 図鑑カードに描くときだけ一時的に差し替える
  const W = 800, H = 520, WATER = 190;
  const MAX_CASTS = 5;
  const HOOK_X = 420;
  const DEPTH_TOP = 240, DEPTH_RANGE = 150; // 魚が下のゲージに隠れない範囲に収める

  // 魚の種類（大きさごとの設定）
  const FISH = {
    small:  { label: '小', points: 5,  scale: 0.6, color: '#ffb347', zone: 0.30, speed: 1.0 },
    medium: { label: '中', points: 10, scale: 1.0, color: '#ff7a8a', zone: 0.20, speed: 1.5 },
    large:  { label: '大', points: 15, scale: 1.6, color: '#7fd0ff', zone: 0.12, speed: 2.1 },
  };
  function sizeFromDepth(d) { return d < 0.40 ? 'small' : d < 0.75 ? 'medium' : 'large'; }

  // 魚の種類（各サイズに3種。点数はサイズで決まる）
  const SPECIES = {
    small: [
      { name: 'イワシ', color: '#9fb8d0', shape: 'slim' },
      { name: 'アジ',   color: '#7ec8a0', shape: 'slim' },
      { name: 'フグ',   color: '#e8d27a', shape: 'round' },
      { name: 'キス',   color: '#f2dcb5', shape: 'slim' },
      { name: 'サバ',   color: '#5aa0b8', shape: 'slim' },
      { name: 'メバル', color: '#c8503a', shape: 'spiky' },
    ],
    medium: [
      { name: 'マダイ',   color: '#ff7a8a', shape: 'normal' },
      { name: 'カサゴ',   color: '#e0603a', shape: 'spiky' },
      { name: 'カレイ',   color: '#c9a46b', shape: 'flat' },
      { name: 'スズキ',   color: '#aab8c4', shape: 'normal' },
      { name: 'ウツボ',   color: '#8a7a4a', shape: 'eel' },
      { name: 'ヒラメ',   color: '#b89a78', shape: 'flat' },
    ],
    large: [
      { name: 'マグロ', color: '#4a78c8', shape: 'tuna' },
      { name: 'サメ',   color: '#8a9aa8', shape: 'shark' },
      { name: 'カジキ', color: '#3a9fd8', shape: 'marlin' },
      { name: 'ブリ',       color: '#5f9cb5', shape: 'tuna' },
      { name: 'エイ',       color: '#9a8ab0', shape: 'ray' },
      { name: 'シュモクザメ', color: '#7a8a98', shape: 'hammer' },
    ],
  };
  // 各サイズ30種になるよう追加（pat: 'stripe'=しま模様 / 'spot'=水玉模様）
  const add = (kind, rows) => rows.forEach(([name, color, shape, pat]) => SPECIES[kind].push({ name, color, shape, pat }));
  add('small', [
    ['サンマ', '#6a8fa8', 'slim'], ['ハゼ', '#b0a070', 'slim', 'spot'], ['シラス', '#e8e8f0', 'slim'],
    ['カマス', '#c0c8b0', 'slim'], ['サヨリ', '#d0e0e8', 'slim'], ['ボラ', '#8a98a0', 'slim'],
    ['ニシン', '#7aa0c0', 'slim'], ['イカナゴ', '#d8d0b0', 'slim'], ['ハコフグ', '#f0d040', 'round', 'spot'],
    ['ミノカサゴ', '#c04040', 'spiky', 'stripe'], ['クマノミ', '#ff8a30', 'normal', 'stripe'], ['ネンブツダイ', '#e0a0a0', 'slim', 'stripe'],
    ['カワハギ', '#b0b890', 'flat', 'spot'], ['イシモチ', '#c8c8d8', 'normal'], ['ベラ', '#4aa88a', 'normal'],
    ['スズメダイ', '#3a6ab0', 'round'], ['キンギョハナダイ', '#ff9acb', 'normal'], ['ハタンポ', '#f0c060', 'slim'],
    ['アイゴ', '#8a9a58', 'normal', 'spot'], ['ギンポ', '#a89070', 'eel'], ['ダツ', '#a0d0c8', 'slim'],
    ['トビウオ', '#5a90d0', 'slim', 'stripe'], ['チョウチョウウオ', '#ffe060', 'round', 'stripe'], ['ニザダイ', '#6a7a90', 'flat'],
  ]);
  add('medium', [
    ['ブダイ', '#4ab0a0', 'normal', 'spot'], ['イシダイ', '#a8b0b8', 'normal', 'stripe'], ['クロダイ', '#4a5058', 'normal'],
    ['ホウボウ', '#e07a50', 'spiky', 'spot'], ['アカハタ', '#d05a4a', 'spiky', 'spot'], ['キンメダイ', '#e03a3a', 'normal'],
    ['アマダイ', '#e8b090', 'normal'], ['ムツ', '#5a4a60', 'normal'], ['イサキ', '#b09060', 'normal', 'stripe'],
    ['ハマチ', '#6aa8c0', 'tuna'], ['カツオ', '#4a6aa0', 'tuna', 'stripe'], ['サワラ', '#9ab0c8', 'slim'],
    ['タチウオ', '#c8d0d8', 'eel'], ['アナゴ', '#7a6a58', 'eel'], ['ハモ', '#b8a890', 'eel'],
    ['メジナ', '#3a5a48', 'normal'], ['ハタ', '#8a6a50', 'spiky', 'spot'], ['マダラ', '#a89a7a', 'normal', 'spot'],
    ['アイナメ', '#b08a4a', 'spiky', 'spot'], ['ソイ', '#706050', 'spiky'], ['コチ', '#a89870', 'flat', 'spot'],
    ['オコゼ', '#907060', 'spiky', 'spot'], ['ヘダイ', '#d0d0c0', 'normal'], ['シマアジ', '#98b8a0', 'normal', 'stripe'],
  ]);
  add('large', [
    ['クロマグロ', '#2a4a8a', 'tuna'], ['キハダ', '#d0c040', 'tuna'], ['メバチ', '#5a7aa8', 'tuna'],
    ['カンパチ', '#78a898', 'tuna', 'stripe'], ['ヒラマサ', '#6aa0a8', 'tuna'], ['バショウカジキ', '#2a60b0', 'marlin'],
    ['メカジキ', '#6a7a90', 'marlin'], ['マカジキ', '#4a8ac8', 'marlin', 'stripe'], ['ホホジロザメ', '#8a98a8', 'shark'],
    ['ジンベエザメ', '#5a7090', 'shark', 'spot'], ['ヨシキリザメ', '#4a6aa8', 'shark'], ['トラフザメ', '#c0a860', 'shark', 'spot'],
    ['ノコギリザメ', '#a09080', 'marlin'], ['マンタ', '#3a4a6a', 'ray'], ['アカエイ', '#b08050', 'ray'],
    ['トビエイ', '#6a7aa0', 'ray', 'spot'], ['シイラ', '#60c070', 'normal', 'spot'], ['ロウニンアジ', '#7090a0', 'tuna'],
    ['ターポン', '#c8d0d8', 'normal'], ['オヒョウ', '#7a6a58', 'flat', 'spot'], ['チョウザメ', '#6a6a58', 'shark', 'spot'],
    ['ウバザメ', '#7a8088', 'shark'], ['リュウグウノツカイ', '#e0e8f0', 'eel'], ['シロカジキ', '#8ab0d0', 'marlin'],
  ]);

  // 幻の魚：深場（大サイズ域）でのみ低確率で出現。点数・難しさは個別設定
  const RARES = {
    small:  { name: '黄金のアジ',   color: '#ffd23a', shape: 'slim',   rare: true, points: 100, zone: 0.07, speed: 2.5 },
    medium: { name: '黄金のマダイ', color: '#ffd23a', shape: 'normal', rare: true, points: 100, zone: 0.07, speed: 2.5 },
    large:  { name: '黄金のマグロ', color: '#ffd23a', shape: 'tuna',   rare: true, points: 100, zone: 0.07, speed: 2.5 },
  };
  const RARE_RATE = 0.08; // 各深さでの幻の魚の出現率
  function pickSpecies(kind, allowRare = false) {
    if (allowRare && Math.random() < RARE_RATE) return RARES[kind];
    const list = SPECIES[kind];
    return list[Math.floor(Math.random() * list.length)];
  }
  function pointsOf() { return species.points || FISH[fishKind].points; }

  // ---- 図鑑（釣った魚の記録。端末のブラウザに保存） ----
  const ZUKAN_KEY = 'umitsuri_zukan_v1';
  let zukan = {}; // { 魚の名前: 釣った匹数 }
  try { zukan = JSON.parse(localStorage.getItem(ZUKAN_KEY) || '{}') || {}; } catch (e) { zukan = {}; }
  function saveZukan() { try { localStorage.setItem(ZUKAN_KEY, JSON.stringify(zukan)); } catch (e) {} }
  let isNew = false; // 今回釣った魚が図鑑に初登録か

  const ZUKAN_TABS = [['small', '浅い'], ['medium', '中間'], ['large', '深い'], ['rare', '幻']];
  const ZK_SCALE = { small: 0.85, medium: 0.9, large: 0.95 };
  const DEPTH_LABEL = { small: '浅い海', medium: '中くらいの深さ', large: '深い海' };

  // 魚の説明（図鑑で釣った魚をクリックすると表示）
  const DESC = {
    // --- 浅い ---
    'イワシ': '群れをつくって泳ぐ小さな魚。海の食べ物のつながりを下から支える大切な存在で、大きな魚たちの大事なごちそうになる。',

    'フグ': '敵におそわれるとお腹をふくらませて身を守る。種類によっては強い毒をもつので、むやみに食べてはいけない。',
    'キス': '砂地の浅い海にすむほっそりした魚。天ぷらの定番で、投げ釣りの人気ターゲット。',
    'サバ': '青緑の背に波のような模様がある回遊魚。脂がのっていて、塩焼きやみそ煮で食べられる。',

    'シラス': 'イワシの仲間の子ども。体が透き通っていて、ゆでたり干したりして食べられる。',
    'カマス': '鋭い歯をもつ細長い魚。小魚を見つけると素早く追いかけて捕まえる。',

    'ボラ': '河口や港にも入ってくる丈夫な魚。成長するにつれて呼び名が変わる出世魚として知られる。',

    // --- 幻 ---
    '黄金のアジ': '浅い海にときどき現れるという幻のアジ。金色に輝く体は、見ただけで幸運が訪れるといわれる。',
    '黄金のマダイ': '中ほどの深さにひそむ幻のマダイ。お祝いの魚が金色になった、おめでたさ極まる姿。',

  };
  let zukanTab = 'small';
  function zukanList(tab) {
    if (tab === 'rare') return ['small', 'medium', 'large'].map(k => ({ kind: k, sp: RARES[k], rare: true }));
    return SPECIES[tab].map(sp => ({ kind: tab, sp, rare: false }));
  }
  function zukanAll() { return ZUKAN_TABS.flatMap(([t]) => zukanList(t)); }
  function zukanTotal() { return zukanAll().length; }
  function zukanGot() { return zukanAll().filter(e => zukan[e.sp.name] > 0).length; }

  // ---- BGM ----
  // 外部の音声ファイルは使わず、ブラウザの音声合成（Web Audio）でその場で演奏する。
  //   calm … 魚を待っているとき（ゆったり・波の音つき）
  //   fish … 魚がヒットして引き上げているとき（テンポが速く、盛り上がる）
  const Music = (() => {
    const KEY = 'umitsuri_bgm';
    const VOL = 0.55;
    let ac = null, master = null, noiseBuf = null, timer = null;
    let enabled = true;
    try { enabled = localStorage.getItem(KEY) !== '0'; } catch (e) {}
    let want = null, cur = null; // 流したいBGM / 今流しているBGM
    const runners = [];          // 演奏中のBGM（フェードアウト中も含む）

    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

    function ensure() {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = enabled ? VOL : 0;
        const comp = ac.createDynamicsCompressor(); // 音がはみ出さないように
        master.connect(comp); comp.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); // 波の音・ハイハット用のノイズ
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        timer = setInterval(tick, 25);
      }
      if (ac.state === 'suspended') ac.resume();
      return true;
    }

    // --- 音の部品 ---
    function tone(dest, t, freq, dur, type, vol, o = {}) { // 持続する音
      const osc = ac.createOscillator();
      osc.type = type; osc.frequency.setValueAtTime(freq, t);
      if (o.detune) osc.detune.value = o.detune;
      const g = ac.createGain();
      const a = o.attack || 0.01, r = o.release || 0.08;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + a);
      g.gain.setValueAtTime(vol, Math.max(t + a, t + dur));
      g.gain.linearRampToValueAtTime(0.0001, t + dur + r);
      if (o.lp) {
        const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp;
        osc.connect(f); f.connect(g);
      } else osc.connect(g);
      g.connect(dest);
      osc.start(t); osc.stop(t + dur + r + 0.05);
    }
    function pluck(dest, t, freq, dur, vol, type) { // はじいて、すっと消える音（オルゴール風）
      const osc = ac.createOscillator();
      osc.type = type || 'sine'; osc.frequency.value = freq;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(dest);
      osc.start(t); osc.stop(t + dur + 0.05);
    }
    function noise(dest, t, dur, vol, type, freq, q) { // シャッ・ザッという音
      const src = ac.createBufferSource(); src.buffer = noiseBuf;
      const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q || 0.7;
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(dest);
      src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.02);
    }
    function kick(dest, t, vol) {
      const osc = ac.createOscillator(); osc.type = 'sine';
      osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(45, t + 0.12);
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      osc.connect(g); g.connect(dest); osc.start(t); osc.stop(t + 0.25);
    }

    // --- 効果音（BGMとは別に、マスター音量に直接つなぐ）---
    function sweep(t, dur, f0, f1, vol, q) { // ヒュッという風切り音
      const src = ac.createBufferSource(); src.buffer = noiseBuf;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q || 1.2;
      f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + dur * 0.3);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
    }
    function splash(t, vol) { // ざぶん
      noise(master, t, 0.45, vol, 'lowpass', 1400, 0.6);
      noise(master, t, 0.25, vol * 0.6, 'highpass', 3500, 0.7);
      pluck(master, t, 180, 0.25, vol * 0.5, 'sine');
    }
    const SFX = {
      tick() { const t = ac.currentTime; pluck(master, t, 880, 0.08, 0.14, 'triangle'); },       // 投げる準備（クリック）
      cast() { // 竿を振って、ルアーが海に落ちる
        const t = ac.currentTime;
        sweep(t, 0.32, 500, 3000, 0.5, 1.5);
        splash(t + 0.34, 0.28);
      },
      catch() { // 釣れた！ 明るい上昇アルペジオ
        const t = ac.currentTime;
        splash(t, 0.22);
        [72, 76, 79, 84].forEach((n, i) => {
          pluck(master, t + 0.1 + i * 0.09, mtof(n), 0.5, 0.17, 'triangle');
          pluck(master, t + 0.1 + i * 0.09, mtof(n + 12), 0.35, 0.05, 'sine');
        });
        [72, 76, 79, 84].forEach(n => tone(master, t + 0.5, mtof(n), 0.35, 'triangle', 0.05, { release: 0.4 }));
      },
      rare() { // 幻の魚：豪華なファンファーレ
        const t = ac.currentTime;
        splash(t, 0.25);
        [67, 72, 76, 79, 84, 88, 91, 96].forEach((n, i) => {
          pluck(master, t + 0.08 + i * 0.075, mtof(n), 0.6, 0.15, 'triangle');
          pluck(master, t + 0.08 + i * 0.075, mtof(n + 12), 0.4, 0.045, 'sine');
        });
        [60, 64, 67, 72, 76].forEach(n => tone(master, t + 0.72, mtof(n), 0.7, 'sawtooth', 0.03, { lp: 2400, release: 0.6 }));
        for (let i = 0; i < 6; i++) pluck(master, t + 0.75 + i * 0.07, mtof(100 + (i % 3) * 2), 0.2, 0.04, 'sine'); // きらきら
      },
      miss() { // 逃げられた…（下がっていく音）
        const t = ac.currentTime;
        noise(master, t, 0.18, 0.12, 'lowpass', 900, 0.6);
        [67, 64, 60, 55].forEach((n, i) => {
          tone(master, t + 0.05 + i * 0.2, mtof(n), i === 3 ? 0.55 : 0.16, 'triangle', 0.16, { lp: 1200, attack: 0.02, release: 0.12 });
        });
      },
    };

    // --- calm：魚を待っているときの、ゆったりしたBGM（ハ長調・テンポ70）---
    const CALM = {
      bpm: 70, len: 128, // 16分音符128個 = 8小節
      chords: [[48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50]], // C Am F G
      roots: [36, 33, 29, 31],
      melody: [ // 各小節の [何拍目(16分単位), 音]
        [[0, 76], [6, 74], [8, 72], [12, 74]], [[0, 72], [4, 76], [8, 81], [12, 76]],
        [[0, 81], [6, 79], [8, 76], [12, 79]], [[0, 79], [4, 76], [8, 74], [12, 72]],
        [[0, 84], [6, 81], [8, 79], [12, 76]], [[0, 81], [4, 79], [8, 76], [12, 72]],
        [[0, 76], [4, 79], [8, 81], [12, 84]], [[0, 83], [6, 79], [8, 74], [12, 79]],
      ],
      start(bus) { // 打ち寄せる波の音
        const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
        const g = ac.createGain(); g.gain.value = 0.05;
        const lfo = ac.createOscillator(); lfo.frequency.value = 0.11;
        const lg = ac.createGain(); lg.gain.value = 0.035;
        lfo.connect(lg); lg.connect(g.gain);
        src.connect(lp); lp.connect(g); g.connect(bus);
        src.start(); lfo.start();
        return () => { try { src.stop(); lfo.stop(); } catch (e) {} };
      },
      step(i, t, bus) {
        const bar = Math.floor(i / 16) % 8, s = i % 16, ch = bar % 4;
        const sd = 60 / this.bpm / 4, chord = this.chords[ch];
        if (s === 0) { // パッド（ふんわり持続する和音）
          chord.forEach(n => {
            tone(bus, t, mtof(n + 12), sd * 16, 'sine', 0.042, { attack: 0.9, release: 1.4 });
            tone(bus, t, mtof(n + 12), sd * 16, 'triangle', 0.016, { attack: 1.1, release: 1.4, detune: 7 });
          });
        }
        if (s === 0 || s === 8) tone(bus, t, mtof(this.roots[ch]), sd * 6, 'sine', 0.12, { attack: 0.02, release: 0.6 });
        if (s % 2 === 0) { // アルペジオ
          const k = [0, 2, 1, 2, 0, 2, 1, 2][s / 2];
          pluck(bus, t, mtof(chord[k] + 24), 0.55, 0.03, 'triangle');
        }
        this.melody[bar].forEach(([ms, n]) => { // メロディ
          if (ms === s) {
            pluck(bus, t, mtof(n), 1.1, 0.05, 'sine');
            pluck(bus, t, mtof(n + 12), 0.6, 0.012, 'sine');
          }
        });
      },
    };

    // --- fish：ヒットして引き上げているときの、速くて盛り上がるBGM（イ短調・テンポ140）---
    const FISH = {
      bpm: 140, len: 128,
      chords: [[69, 72, 76], [65, 69, 72], [67, 71, 74], [64, 67, 71]], // Am F G Em
      roots: [45, 41, 43, 40],
      intro(bus, t) { // ヒットした瞬間の「ジャン！」
        [57, 60, 64, 69].forEach(n => tone(bus, t, mtof(n), 0.22, 'sawtooth', 0.045, { lp: 2600, release: 0.25 }));
        noise(bus, t, 0.5, 0.1, 'highpass', 5000, 0.7);
        kick(bus, t, 0.7);
      },
      step(i, t, bus) {
        const bar = Math.floor(i / 16) % 8, s = i % 16, ch = bar % 4;
        const sd = 60 / this.bpm / 4, chord = this.chords[ch], root = this.roots[ch];
        if (s % 4 === 0) kick(bus, t, 0.5);
        if (s === 4 || s === 12) { noise(bus, t, 0.13, 0.2, 'bandpass', 1800, 0.8); pluck(bus, t, 190, 0.1, 0.08, 'triangle'); }
        if (s % 2 === 0) noise(bus, t, 0.05, s % 4 === 2 ? 0.1 : 0.05, 'highpass', 7000, 0.7);
        if (s % 2 === 0) { // ベース（8分音符で走る）
          tone(bus, t, mtof(s % 8 === 6 ? root + 12 : root), sd * 1.8, 'sawtooth', 0.085, { lp: 520, attack: 0.005, release: 0.05 });
        }
        if (s === 0 || s === 6 || s === 10) { // 和音のスタッカート
          chord.forEach(n => tone(bus, t, mtof(n), sd * 1.5, 'sawtooth', 0.022, { lp: 2200, attack: 0.004, release: 0.05 }));
        }
        const up = bar >= 4 ? 12 : 0; // 後半は1オクターブ上がって盛り上がる
        const note = chord[[0, 1, 2, 1][s % 4]] + up;
        tone(bus, t, mtof(note), sd * 0.9, 'square', 0.02, { lp: 3200, attack: 0.003, release: 0.04 });
      },
    };
    const TRACKS = { calm: CALM, fish: FISH };

    // --- 再生の管理 ---
    function startTrack(def) {
      const now = ac.currentTime;
      const bus = ac.createGain();
      bus.gain.setValueAtTime(0.0001, now);
      bus.gain.linearRampToValueAtTime(1, now + 0.35);
      bus.connect(master);
      const r = { def, bus, idx: 0, next: now + 0.06, stopAt: null, cleanup: def.start ? def.start(bus) : null };
      if (def.intro) def.intro(bus, r.next);
      runners.push(r);
    }
    function stopTrack(r, fade) {
      const now = ac.currentTime;
      r.bus.gain.cancelScheduledValues(now);
      r.bus.gain.setValueAtTime(r.bus.gain.value, now);
      r.bus.gain.linearRampToValueAtTime(0.0001, now + fade);
      r.stopAt = now + fade + 0.1;
    }
    function tick() { // 少し先の音を、先回りして予約していく
      if (!ac) return;
      const now = ac.currentTime;
      for (let k = runners.length - 1; k >= 0; k--) {
        const r = runners[k];
        if (r.stopAt) {
          if (now > r.stopAt) { if (r.cleanup) r.cleanup(); r.bus.disconnect(); runners.splice(k, 1); }
          continue;
        }
        const sd = 60 / r.def.bpm / 4;
        if (r.next < now - 0.5) r.next = now + 0.05; // 長く止まっていたら、遅れを取り戻さず今から再開
        while (r.next < now + 0.2) { r.def.step(r.idx % r.def.len, r.next, r.bus); r.next += sd; r.idx++; }
      }
    }
    function apply() {
      if (!ac || ac.state !== 'running' || want === cur) return;
      runners.forEach(r => { if (!r.stopAt) stopTrack(r, 0.45); });
      cur = want;
      if (want) startTrack(TRACKS[want]);
    }

    return {
      unlock() { ensure(); },                 // 画面をクリックしたときに呼ぶ（ブラウザの決まりで、音は操作の後でないと出せない）
      mood(name) { want = name; apply(); },   // 流したいBGMを伝える（null なら止める）
      toggle() {
        ensure();
        enabled = !enabled;
        try { localStorage.setItem(KEY, enabled ? '1' : '0'); } catch (e) {}
        if (ac) master.gain.setTargetAtTime(enabled ? VOL : 0, ac.currentTime, 0.05);
        return enabled;
      },
      isOn() { return enabled; },
      sfx(name) { if (ac && enabled && SFX[name]) { if (ac.state === 'suspended') ac.resume(); SFX[name](); } },
      pause() { if (ac && ac.state === 'running') ac.suspend(); },
      resume() { if (ac && ac.state === 'suspended') ac.resume(); },
    };
  })();

  // ---- 状態 ----
  let state = 'title';
  let casts, score, caughtList, castNo;
  let gaugePos, gaugeDir, gaugeSpeed;
  let depth, hookY, targetY, sinkT;
  let fishKind, species, fishX, fishY, waitT, waitTotal;
  let zoneStart, zoneW;
  let resultT, success, popup, shake;
  let time = 0;

  const bubbles = [];
  function initBubbles() {
    bubbles.length = 0;
    for (let i = 0; i < 18; i++) {
      bubbles.push({ x: Math.random() * W, y: WATER + Math.random() * (H - WATER), r: 1.5 + Math.random() * 3.5, sp: 18 + Math.random() * 30, ph: Math.random() * 6 });
    }
  }

  const ambient = [];
  function initAmbient() {
    ambient.length = 0;
    const spec = [
      ['small', 3, 245, 295], ['medium', 3, 305, 350], ['large', 2, 358, 392],
    ];
    spec.forEach(([k, n, y0, y1]) => {
      for (let i = 0; i < n; i++) {
        ambient.push({
          kind: k, sp: pickSpecies(k), x: Math.random() * W, y: y0 + Math.random() * (y1 - y0),
          dir: Math.random() < 0.5 ? 1 : -1,
          speed: (FISH[k].scale > 1 ? 14 : FISH[k].scale > 0.8 ? 24 : 34) + Math.random() * 12,
        });
      }
    });
  }

  function resetGame() {
    casts = MAX_CASTS; score = 0; caughtList = []; castNo = 0;
    popup = null; shake = 0; hookY = WATER - 30;
    state = 'ready';
    initAmbient();
    initBubbles();
  }

  // ---- 入力 ----
  function onClick() {
    Music.unlock();
    if (state === 'ready') {
      Music.sfx('tick');
      castNo++;
      gaugePos = 0; gaugeDir = 1; gaugeSpeed = 0.9;
      state = 'depth';
    } else if (state === 'depth') {
      Music.sfx('cast');
      depth = gaugePos;
      fishKind = sizeFromDepth(depth);
      species = pickSpecies(fishKind, true);
      targetY = DEPTH_TOP + depth * DEPTH_RANGE;
      sinkT = 0;
      state = 'sink';
    } else if (state === 'reel') {
      const hit = gaugePos >= zoneStart && gaugePos <= zoneStart + zoneW;
      success = hit;
      resultT = 0;
      Music.sfx(hit ? (species.rare ? 'rare' : 'catch') : 'miss');
      if (hit) {
        score += pointsOf();
        caughtList.push({ kind: fishKind, sp: species });
        isNew = !(zukan[species.name] > 0);
        zukan[species.name] = (zukan[species.name] || 0) + 1;
        saveZukan();
        popup = { text: '+' + pointsOf(), t: 0 };
      }
      casts--;
      state = 'result';
    }
  }
  cv.addEventListener('mousedown', onClick);
  cv.addEventListener('touchstart', e => { e.preventDefault(); onClick(); }, { passive: false });

  document.getElementById('startBtn').onclick = () => {
    Music.unlock();
    document.getElementById('startScreen').classList.add('hidden');
    resetGame();
  };
  document.getElementById('retryBtn').onclick = () => {
    Music.unlock();
    document.getElementById('resultScreen').classList.add('hidden');
    resetGame();
  };

  // BGMのオン・オフ（ボタン／Mキー）と、画面を見ていないときの一時停止
  const muteBtn = document.getElementById('muteBtn');
  const showMute = () => { muteBtn.textContent = Music.isOn() ? '🔊' : '🔇'; };
  muteBtn.onclick = () => { Music.toggle(); showMute(); };
  document.addEventListener('keydown', e => {
    if ((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.metaKey && !e.altKey) { Music.toggle(); showMute(); }
  });
  document.addEventListener('visibilitychange', () => { document.hidden ? Music.pause() : Music.resume(); });
  showMute();
  document.getElementById('zukanBtn1').onclick = () => openZukan();
  document.getElementById('zukanBtn2').onclick = () => openZukan();
  document.getElementById('zukanClose').onclick = () => {
    document.getElementById('zukanScreen').classList.add('hidden');
    document.getElementById('zukanDetail').classList.add('hidden');
  };
  document.getElementById('zdBack').onclick = () => {

  };
  document.getElementById('zukanReset').onclick = () => {
    if (confirm('図鑑の記録をすべて消します。よろしいですか？')) {
      zukan = {}; saveZukan(); renderZukan();
    }
  };

  // ---- 更新 ----
  function oscillate(dt) {
    gaugePos += gaugeDir * gaugeSpeed * dt;
    if (gaugePos >= 1) { gaugePos = 1; gaugeDir = -1; }
    if (gaugePos <= 0) { gaugePos = 0; gaugeDir = 1; }
  }

  function update(dt) {
    time += dt;
    ambient.forEach(a => {
      a.x += a.dir * a.speed * dt;
      if (a.x > W + 80) a.x = -80;
      if (a.x < -80) a.x = W + 80;
    });
    bubbles.forEach(b => {
      b.y -= b.sp * dt;
      b.x += Math.sin(time * 2 + b.ph) * 8 * dt;
      if (b.y < WATER + 4) { b.y = H - 20; b.x = Math.random() * W; }
    });
    if (shake > 0) shake = Math.max(0, shake - dt);

    if (state === 'depth') {
      oscillate(dt);
    } else if (state === 'sink') {
      sinkT += dt;
      const p = Math.min(1, sinkT / 1.1);
      const e = 1 - Math.pow(1 - p, 2);
      hookY = (WATER - 30) + (targetY - (WATER - 30)) * e;
      if (p >= 1) {
        waitTotal = 0.9 + Math.random() * 1.1; waitT = 0;
        state = 'wait';
      }
    } else if (state === 'wait') {
      waitT += dt;
      const p = Math.min(1, waitT / waitTotal);
      fishX = HOOK_X + 260 - 245 * p;
      fishY = targetY + Math.sin(time * 6) * 3;
      if (p >= 1) {
        const f = FISH[fishKind];
        zoneW = species.zone || f.zone;
        zoneStart = 0.12 + Math.random() * (0.88 - 0.12 - zoneW);
        gaugePos = 0; gaugeDir = 1; gaugeSpeed = species.speed || f.speed;
        shake = 0.4;
        state = 'reel';
      }
    } else if (state === 'reel') {
      oscillate(dt);
    } else if (state === 'result') {
      resultT += dt;
      if (success) {
        const p = Math.min(1, resultT / 0.9);
        hookY = targetY + ((WATER - 30) - targetY) * p;
        fishX = HOOK_X + 15 * (1 - p) ; fishY = hookY;
      } else {
        fishX += 220 * dt; // 逃げる
        hookY = Math.max(WATER - 30, hookY - 60 * dt);
      }
      if (popup) popup.t += dt;
      if (resultT > 1.9) {
        popup = null;
        hookY = WATER - 30;
        if (casts <= 0) finish(); else state = 'ready';
      }
    }
  }

  function finish() {
    state = 'end';
    document.getElementById('finalScore').textContent = score;
    const gotRare = caughtList.some(c => c.sp.rare);
    const rank = gotRare ? '★ 伝説の釣り人 ★' : score >= 60 ? '釣り名人！' : score >= 40 ? '釣り上手' : score >= 20 ? '釣り人見習い' : 'これから伸びるぞ！';
    document.getElementById('rankText').textContent = rank;
    const counts = {};
    caughtList.forEach(c => { counts[c.sp.name] = (counts[c.sp.name] || 0) + 1; });
    const names = Object.keys(counts).map(n => n + '×' + counts[n]);
    document.getElementById('detailText').innerHTML =
      '釣果：' + (names.length ? names.join('、') : 'なし') + '<br>' +
      '（逃がした魚：' + (MAX_CASTS - caughtList.length) + ' 匹）<br>' +
      '図鑑：' + zukanGot() + ' / ' + zukanTotal() + ' 種を登録済み';
    document.getElementById('resultScreen').classList.remove('hidden');
  }

  // ---- 描画 ----
  function tri(x1, y1, x2, y2, x3, y3) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath(); ctx.fill();
  }
  function ell(rx, ry, cx = 0, cy = 0) {
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  }
  function eye(x, y, r = 4) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#123'; ctx.beginPath(); ctx.arc(x + 1, y, r / 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.arc(x + 0.4, y - r * 0.35, r * 0.24, 0, Math.PI * 2); ctx.fill();
  }

  // 魚の基本形（平らな色塗り）。陰影つきの描画は下の drawFish が担当
  function drawFishFlat(x, y, scale, color, dir, shape = 'normal', pat = null) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(dir * scale, scale);
    ctx.fillStyle = color;
    const belly = 'rgba(255,255,255,0.35)';
    switch (shape) {
      case 'slim': // イワシ・アジ
        tri(-22, 0, -40, -11, -40, 11);
        ell(28, 9);
        tri(-6, -8, 4, -16, 12, -8);
        ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(2, 4, 22, 4, 0, 0, Math.PI); ctx.fill();
        eye(18, -2, 3);
        break;
      case 'round': // フグ
        tri(-16, 0, -30, -8, -30, 8);
        ell(22, 19);
        ctx.fillStyle = '#b8a040';
        for (let a = -2; a <= 2; a++) tri(a * 9 - 3, -17, a * 9 + 3, -17, a * 9, -24);
        ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(0, 8, 16, 9, 0, 0, Math.PI); ctx.fill();
        eye(12, -4, 4);
        ctx.strokeStyle = '#b8603a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(20, 4, 4, 0.3, 2.8); ctx.stroke();
        break;
      case 'spiky': // カサゴ
        tri(-22, 0, -40, -14, -40, 14);
        ell(28, 15);
        for (let i = 0; i < 5; i++) tri(-16 + i * 7, -13, -12 + i * 7, -25, -8 + i * 7, -13);
        ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(2, 6, 20, 7, 0, 0, Math.PI); ctx.fill();
        eye(15, -3);
        break;
      case 'flat': // カレイ
        tri(-26, 0, -42, -10, -42, 10);
        ell(30, 19);
        ctx.fillStyle = 'rgba(120,80,40,0.45)';
        [[-8, -4, 4], [6, 5, 3], [-16, 6, 3], [10, -8, 3]].forEach(([cx, cy, r]) => {
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
        });
        ctx.fillStyle = color; tri(-10, -18, 4, -26, 14, -17);
        eye(18, -6, 3.5); eye(11, -10, 3.5);
        break;
      case 'tuna': // マグロ
        tri(-26, 0, -46, -18, -40, 0); tri(-26, 0, -46, 18, -40, 0);
        ell(32, 14);
        ctx.fillStyle = '#2c4a8a'; ell(30, 7, 0, -8);
        ctx.fillStyle = '#f0d040';
        for (let i = 0; i < 4; i++) tri(-22 + i * 5, -11, -19 + i * 5, -16, -17 + i * 5, -11);
        ctx.fillStyle = color; tri(-2, -13, 8, -24, 14, -12);
        ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(2, 6, 24, 6, 0, 0, Math.PI); ctx.fill();
        eye(20, -2, 3.5);
        break;
      case 'shark': // サメ
        tri(-28, 0, -46, -20, -40, 0); tri(-28, 0, -40, 14, -36, 0);
        ctx.beginPath(); ctx.moveTo(34, 2); ctx.quadraticCurveTo(20, -14, -28, -10);
        ctx.lineTo(-28, 10); ctx.quadraticCurveTo(20, 14, 34, 2); ctx.fill();
        tri(-6, -11, 8, -30, 16, -10);
        ctx.fillStyle = '#e8eef2'; ctx.beginPath(); ctx.ellipse(6, 6, 24, 5, 0, 0, Math.PI); ctx.fill();
        ctx.strokeStyle = '#345'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(14, 6); ctx.moveTo(18, 0); ctx.lineTo(18, 6); ctx.moveTo(22, 0); ctx.lineTo(22, 5); ctx.stroke();
        eye(22, -3, 2.5);
        break;
      case 'marlin': // カジキ
        tri(-26, 0, -44, -16, -40, 0); tri(-26, 0, -44, 16, -40, 0);
        ell(28, 11);
        ctx.fillStyle = '#c0c8d0'; tri(26, -2, 60, 0, 26, 3); // 吻
        ctx.fillStyle = '#2a6fb0';
        ctx.beginPath(); ctx.moveTo(-18, -9); ctx.quadraticCurveTo(0, -34, 18, -9); ctx.closePath(); ctx.fill();
        ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(2, 5, 22, 5, 0, 0, Math.PI); ctx.fill();
        eye(17, -2, 3);
        break;
      case 'eel': { // ウツボ
        ctx.strokeStyle = color; ctx.lineWidth = 15; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        for (let px = -46; px <= 24; px += 4) {
          const py = Math.sin(px * 0.14 + time * 6) * 5;
          px === -46 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 4;
        ctx.beginPath();
        for (let px = -40; px <= 20; px += 4) {
          const py = Math.sin(px * 0.14 + time * 6) * 5 - 3;
          px === -40 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.stroke();
        const hy = Math.sin(28 * 0.14 + time * 6) * 5;
        ctx.fillStyle = color; ell(12, 9, 30, hy);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(38, hy + 3); ctx.lineTo(30, hy + 3); ctx.stroke();
        eye(32, hy - 3, 3);
        break;
      }
      case 'ray': // エイ
        ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(-56, Math.sin(time * 5) * 4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(36, 0); ctx.quadraticCurveTo(10, -34, -26, -4);
        ctx.lineTo(-26, 4); ctx.quadraticCurveTo(10, 34, 36, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ell(16, 8, 4, 0);
        ctx.fillStyle = '#123'; ctx.beginPath(); ctx.arc(22, -5, 2.5, 0, 7); ctx.arc(22, 5, 2.5, 0, 7); ctx.fill();
        break;
      case 'hammer': // シュモクザメ
        tri(-28, 0, -46, -20, -40, 0); tri(-28, 0, -40, 14, -36, 0);
        ctx.beginPath(); ctx.moveTo(28, 0); ctx.quadraticCurveTo(14, -14, -28, -10);
        ctx.lineTo(-28, 10); ctx.quadraticCurveTo(14, 14, 28, 0); ctx.fill();
        tri(-6, -11, 8, -30, 16, -10);
        ctx.fillStyle = '#e8eef2'; ctx.beginPath(); ctx.ellipse(4, 6, 22, 5, 0, 0, Math.PI); ctx.fill();
        ctx.fillStyle = color; ctx.fillRect(24, -16, 11, 32);
        ctx.beginPath(); ctx.arc(29.5, -16, 5.5, 0, 7); ctx.arc(29.5, 16, 5.5, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(31, -17, 3, 0, 7); ctx.arc(31, 17, 3, 0, 7); ctx.fill();
        ctx.fillStyle = '#123'; ctx.beginPath(); ctx.arc(32, -17, 1.5, 0, 7); ctx.arc(32, 17, 1.5, 0, 7); ctx.fill();
        break;
      default: // マダイ
        tri(-22, 0, -40, -14, -40, 14);
        ell(28, 15);
        tri(-8, -13, 4, -23, 12, -12);
        ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(2, 6, 20, 7, 0, 0, Math.PI); ctx.fill();
        eye(15, -3);
    }
    // 模様（しま・水玉）
    if (pat && shape !== 'eel') {
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      if (pat === 'stripe') {
        for (let i = 0; i < 4; i++) ctx.fillRect(-13 + i * 8, -7, 3, 14);
      } else if (pat === 'spot') {
        [[-14, -3], [-6, 3], [2, -4], [10, 2], [-2, 6], [14, -5]].forEach(([cx, cy]) => {
          ctx.beginPath(); ctx.arc(cx, cy, 2.3, 0, Math.PI * 2); ctx.fill();
        });
      }
    }
    ctx.restore();
  }

  // ---- リアルな魚 ----
  // 体の骨格（輪郭）にあわせて、ひれ・うろこ・エラ・目・口・模様を描き込み、
  // 陰影をつけた画像にして使い回す
  const SPR_W = 140, SPR_H = 90, SPR_OX = 72, SPR_OY = 45, SPR_S = 2;
  const spriteCache = {};

  // --- 色（元の色から、背・腹・ひれの色を作る） ---
  function parseColor(c) {
    const m = /^#([0-9a-f]{6})$/i.exec(c || '');
    if (!m) return [128, 160, 200];
    const n = parseInt(m[1], 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function toHsl(rgb) {
    const r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    const l = (mx + mn) / 2;
    let h = 0, s = 0;
    if (mx !== mn) {
      const d = mx - mn;
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return [h, s * 100, l * 100];
  }
  const hsl = (h, s, l, a = 1) =>
    'hsla(' + h.toFixed(0) + ',' + Math.max(0, Math.min(100, s)).toFixed(0) + '%,' +
    Math.max(0, Math.min(100, l)).toFixed(0) + '%,' + a + ')';
  function palette(color, S) {
    const [h, s, l] = toHsl(parseColor(color));
    const P = {
      back: hsl(h, s * 1.05, l * 0.5), belly: hsl(h, s * 0.45, Math.min(94, l + 30)),
      fin: hsl(h, s * 0.95, l * 0.82, 0.92), finTip: hsl(h, s * 0.9, l * 0.7, 0.5),
      ray: hsl(h, s, l * 0.22, 0.42), spine: hsl(h, s, l * 0.2, 0.6), dark: hsl(h, s, l * 0.22),
    };
    if (S && S.fin) { P.fin = S.fin; P.finTip = S.fin; }
    if (S && S.belly) P.belly = S.belly;
    return P;
  }
  function hash(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h;
  }
  function rng(seed) { // 魚ごとに毎回同じになる乱数（模様のばらつき用）
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // --- 形の道具 ---
  function smooth(g, pts) { // 点をなめらかに結んだ閉じた輪郭
    const n = pts.length;
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const m0 = mid(pts[n - 1], pts[0]);
    g.beginPath(); g.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) {
      const p = pts[i], m = mid(p, pts[(i + 1) % n]);
      g.quadraticCurveTo(p[0], p[1], m[0], m[1]);
    }
    g.closePath();
  }
  function profY(arr, x) { // 輪郭のx位置でのy
    const a = arr.slice().sort((p, q) => p[0] - q[0]);
    if (x <= a[0][0]) return a[0][1];
    for (let i = 1; i < a.length; i++) {
      if (x <= a[i][0]) { const t = (x - a[i - 1][0]) / (a[i][0] - a[i - 1][0]); return a[i - 1][1] + (a[i][1] - a[i - 1][1]) * t; }
    }
    return a[a.length - 1][1];
  }
  function dot(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
