  // --- ひれ ---
  function drawFin(g, F, f, side, P, R) {
    const n = Math.max(6, Math.round((f.x1 - f.x0) / 2.2));
    const arr = side < 0 ? F.top : F.bot;
    const tips = [], bases = [];
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const xb = f.x1 + (f.x0 - f.x1) * t;
      const by = profY(arr, xb) - side * 0.8;
      let hi;
      if (f.kind === 'spiny') hi = t < 0.55 ? f.h * (0.92 - 0.1 * t) : f.h * 0.62 * (1 - (t - 0.55) * 0.5);
      else if (f.kind === 'sail') hi = f.h * (0.4 + 0.6 * Math.sin(Math.PI * Math.pow(t, 0.7)));
      else hi = f.h * (0.5 + 0.5 * Math.sin(Math.PI * (0.1 + 0.8 * t)));
      const lean = f.kind === 'sail' ? -2 - t * 3 : (f.kind === 'spiny' && t < 0.55) ? -1 - t * 4 : -3 - t * 2;
      bases.push([xb, by]); tips.push([xb + lean, by + side * hi]);
    }
    const mid = bases[Math.floor(n / 2)][1];
    const gr = g.createLinearGradient(0, mid, 0, mid + side * f.h);
    gr.addColorStop(0, P.fin); gr.addColorStop(1, P.finTip);
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(bases[0][0], bases[0][1]); g.lineTo(tips[0][0], tips[0][1]);
    for (let i = 1; i < n; i++) { // 膜はひれ条の間で少したるむ
      const a = tips[i - 1], b = tips[i];
      g.quadraticCurveTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - side * 1.4, b[0], b[1]);
    }
    g.lineTo(bases[n - 1][0], bases[n - 1][1]); g.closePath(); g.fill();
    for (let i = 0; i < n; i++) { // ひれ条（硬いトゲは太く）
      const stiff = f.kind === 'spiny' && i < n * 0.55;
      g.strokeStyle = stiff ? P.spine : P.ray; g.lineWidth = stiff ? 0.9 : 0.5;
      g.beginPath(); g.moveTo(bases[i][0], bases[i][1]); g.lineTo(tips[i][0], tips[i][1]); g.stroke();
    }
    if (f.kind === 'sail') { // 背びれの斑点
      g.fillStyle = 'rgba(10,30,90,0.5)';
      for (let i = 0; i < 12; i++) {
        const t = 0.1 + R() * 0.8, x = f.x1 + (f.x0 - f.x1) * t;
        const y = profY(arr, x) + side * (2 + R() * f.h * 0.55);
        g.beginPath(); g.ellipse(x - 1.5, y, 0.9, 1.3, 0, 0, Math.PI * 2); g.fill();
      }
    }
  }

  function drawTail(g, T, P, S) {
    const x = T.x, L = T.len, h = T.h, ph = 2.8;
    g.beginPath(); g.moveTo(x + 3, -ph);
    if (T.kind === 'round') {
      g.quadraticCurveTo(x - L * 0.6, -h * 1.05, x - L, -h * 0.35);
      g.quadraticCurveTo(x - L * 1.12, 0, x - L, h * 0.35);
      g.quadraticCurveTo(x - L * 0.6, h * 1.05, x + 3, ph);
    } else if (T.kind === 'trunc') {
      g.quadraticCurveTo(x - L * 0.5, -h, x - L, -h * 0.9);
      g.quadraticCurveTo(x - L * 0.9, 0, x - L, h * 0.9);
      g.quadraticCurveTo(x - L * 0.5, h, x + 3, ph);
    } else { // 二股の尾（マグロやカジキは三日月形）
      const tipW = T.kind === 'lunate' ? 1.12 : 1, nx = T.kind === 'lunate' ? 0.32 : 0.55;
      g.quadraticCurveTo(x - L * 0.45, -h * 0.95, x - L, -h * tipW);
      g.quadraticCurveTo(x - L * (nx + 0.18), -h * 0.2, x - L * nx, 0);
      g.quadraticCurveTo(x - L * (nx + 0.18), h * 0.2, x - L, h * tipW);
      g.quadraticCurveTo(x - L * 0.45, h * 0.95, x + 3, ph);
    }
    g.closePath();
    const gr = g.createLinearGradient(x, 0, x - L, 0);
    gr.addColorStop(0, P.fin); gr.addColorStop(1, P.finTip);
    g.fillStyle = gr; g.fill();
    if (S && S.tailEdge) { g.strokeStyle = S.tailEdge; g.lineWidth = 1.2; g.stroke(); }
    g.strokeStyle = P.ray; g.lineWidth = 0.5;
    for (let i = 0; i <= 11; i++) {
      const a = -1 + 2 * i / 11;
      const ex = T.kind === 'round' ? x - L * (0.95 - 0.3 * a * a) : x - L * (T.kind === 'lunate' ? 0.35 + 0.65 * Math.abs(a) : 0.55 + 0.45 * Math.abs(a));
      g.beginPath(); g.moveTo(x + 1, a * ph * 0.7); g.lineTo(ex, a * h * 0.95); g.stroke();
    }
  }

  function drawFinlets(g, F) { // マグロ類の小さな黄色いひれ（小離鰭）
    g.fillStyle = '#f2d23a'; g.strokeStyle = 'rgba(80,60,0,0.5)'; g.lineWidth = 0.4;
    for (let x = -18; x > -34; x -= 3.3) {
      [-1, 1].forEach(side => {
        const by = profY(side < 0 ? F.top : F.bot, x) - side * 0.6;
        g.beginPath(); g.moveTo(x + 1.4, by); g.lineTo(x - 1.6, by); g.lineTo(x - 2.8, by + side * 4); g.closePath(); g.fill(); g.stroke();
      });
    }
  }

  function drawPelvic(g, F, f, P) {
    const by = profY(F.bot, f.x) - 1;
    if (f.long) { // カジキの細長い腹びれ
      g.strokeStyle = 'rgba(70,90,120,0.8)'; g.lineWidth = 0.9;
      g.beginPath(); g.moveTo(f.x + 1, by); g.quadraticCurveTo(f.x - 4, by + 4, f.x - 11, by + 8); g.stroke();
      return;
    }
    g.fillStyle = P.fin;
    g.beginPath(); g.moveTo(f.x + 2.5, by); g.lineTo(f.x - 1.5, by); g.lineTo(f.x - 5, by + f.h); g.lineTo(f.x + 1, by + f.h * 0.85); g.closePath(); g.fill();
    g.strokeStyle = P.ray; g.lineWidth = 0.5;
    for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(f.x + 1 - i, by); g.lineTo(f.x - 4 + i * 2.2, by + f.h * 0.9); g.stroke(); }
  }

  function drawPect(g, f, P) { // 胸びれ：扇のようにひろがる
    const n = 7;
    const tips = [];
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1), a = Math.PI * (0.9 - 0.27 * t), l = f.len * (0.78 + 0.22 * Math.sin(Math.PI * (0.2 + 0.6 * t)));
      tips.push([f.x + Math.cos(a) * l, f.y + Math.sin(a) * l]);
    }
    g.fillStyle = P.fin;
    g.beginPath(); g.moveTo(f.x + 1.2, f.y - 1.8);
    tips.forEach(p => g.lineTo(p[0], p[1]));
    g.lineTo(f.x - 0.6, f.y + 1.8); g.closePath(); g.fill();
    g.strokeStyle = P.ray; g.lineWidth = 0.5;
    tips.forEach(p => { g.beginPath(); g.moveTo(f.x, f.y); g.lineTo(p[0], p[1]); g.stroke(); });
    g.strokeStyle = P.spine; g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(f.x + 1.2, f.y - 1.8); g.lineTo(tips[0][0], tips[0][1]); g.stroke();
  }

  // --- 目 ---
  function drawEye(g, x, y, r, iris) {
    g.fillStyle = 'rgba(0,0,0,0.6)'; dot(g, x, y, r + 0.8);
    const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
    gr.addColorStop(0, '#fff6d0'); gr.addColorStop(0.45, iris); gr.addColorStop(1, '#5a3a10');
    g.fillStyle = gr; dot(g, x, y, r);
    g.fillStyle = '#05080c'; dot(g, x + r * 0.08, y, r * 0.55);
    g.fillStyle = 'rgba(255,255,255,0.95)'; dot(g, x - r * 0.3, y - r * 0.34, r * 0.24);
    g.fillStyle = 'rgba(255,255,255,0.6)'; dot(g, x + r * 0.25, y + r * 0.3, r * 0.11);
  }

  // --- 体の模様 ---
  function drawMarks(g, shape, pat, name, P, R) {
    const S = SPEC[name];
    const vline = (x) => { g.beginPath(); g.moveTo(x - 1, -24); g.quadraticCurveTo(x + 2.5, 0, x - 1, 24); g.stroke(); };
    if (S && S.marks) {
      S.marks.forEach(m => {
        g.fillStyle = m.c; g.strokeStyle = m.c;
        if (m.t === 'dots') {
          for (let i = 0; i < m.n; i++) {
            dot(g, m.x[0] + R() * (m.x[1] - m.x[0]), m.y[0] + R() * (m.y[1] - m.y[0]), m.r[0] + R() * (m.r[1] - m.r[0]));
          }
        } else if (m.t === 'bands') {
          m.xs.forEach(x => {
            if (m.edge) { g.strokeStyle = m.edge; g.lineWidth = m.w + 1.8; vline(x); }
            g.strokeStyle = m.c; g.lineWidth = m.w; vline(x);
          });
        } else if (m.t === 'hline') {
          g.lineWidth = m.w; g.beginPath(); g.moveTo(m.x[0], m.y + 0.5); g.quadraticCurveTo((m.x[0] + m.x[1]) / 2, m.y - 1, m.x[1], m.y); g.stroke();
        } else if (m.t === 'zig') {
          g.lineWidth = 0.9;
          m.ys.forEach((y0, k) => {
            g.beginPath();
            for (let x = -26; x <= 24; x += 2.5) { const y = y0 + ((Math.round(x / 2.5) + k) % 2 ? 1.1 : -1.1); x === -26 ? g.moveTo(x, y) : g.lineTo(x, y); }
            g.stroke();
          });
        } else if (m.t === 'spot') {
          dot(g, m.x, m.y, m.r);
        }
      });
      return;
    }
    if (pat === 'stripe') {
      g.strokeStyle = shape === 'marlin' ? 'rgba(200,230,255,0.4)' : 'rgba(10,15,30,0.42)'; g.lineWidth = 2.4;
      for (let i = 0; i < 5; i++) vline(-18 + i * 8);
    } else if (pat === 'spot') {
      for (let i = 0; i < 18; i++) {
        g.fillStyle = 'rgba(15,12,8,' + (0.3 + R() * 0.3).toFixed(2) + ')';
        dot(g, -22 + R() * 44, -11 + R() * 19, 0.8 + R() * 1.5);
      }
    } else if (R() < 0.6) { // 模様のない魚にも、うっすらしたまだらを入れる
      g.fillStyle = 'rgba(0,0,0,0.13)';
      for (let i = 0; i < 9; i++) dot(g, -22 + R() * 44, -12 + R() * 8, 0.6 + R() * 1.1);
    }
  }

  function drawScales(g, F) {
    const sz = F.scale;
    g.lineWidth = 0.55;
    for (let row = 0, y = -18; y < 18; y += sz * 0.85, row++) {
      for (let x = -34 + (row % 2) * sz / 2; x < 36; x += sz) {
        g.strokeStyle = 'rgba(0,0,0,0.15)';
        g.beginPath(); g.arc(x, y, sz * 0.62, Math.PI - 1.15, Math.PI + 1.15); g.stroke();
        g.strokeStyle = 'rgba(255,255,255,0.12)';
        g.beginPath(); g.arc(x - 0.35, y - 0.3, sz * 0.62, Math.PI - 1, Math.PI + 1); g.stroke();
      }
    }
  }

  // --- 硬骨魚（アジ・タイ・マグロなど）---
  function drawBony(g, F, shape, color, pat, name) {
    const S = SPEC[name] || {};
    const P = palette(color, S);
    const R = rng(hash(name + '|' + color + '|' + shape));
    const pts = F.top.concat(F.bot);

    if (F.bill) { // カジキの吻（体の後ろから伸びる）
      const bg = g.createLinearGradient(0, -2, 0, 2);
      bg.addColorStop(0, '#5d6878'); bg.addColorStop(1, '#a9b3c0');
      g.fillStyle = bg;
      g.beginPath(); g.moveTo(30, -2.2); g.lineTo(67, 0); g.lineTo(30, 2.6); g.closePath(); g.fill();
    }
    if (S.beak) { // ダツ・サヨリの細長いくちばし
      const bl = S.beak, dy = S.beakDrop || 0;
      g.fillStyle = '#c8d4dc';
      g.beginPath(); g.moveTo(30, -0.8 + dy); g.lineTo(34 + bl, 0.6 + dy); g.lineTo(30, 2.4 + dy); g.closePath(); g.fill();
      if (S.beakTip) {
        g.fillStyle = S.beakTip;
        g.beginPath(); g.moveTo(34 + bl - 5, 0 + dy); g.lineTo(34 + bl, 0.6 + dy); g.lineTo(34 + bl - 5, 1.4 + dy); g.closePath(); g.fill();
      }
    }
    drawTail(g, F.tail, P, S);
    (F.dorsal || []).forEach(f => drawFin(g, F, f, -1, P, R));
    (F.anal || []).forEach(f => drawFin(g, F, f, 1, P, R));
    if (F.finlets) drawFinlets(g, F);

    // 体：背は暗く、腹は明るく
    smooth(g, pts);
    const gr = g.createLinearGradient(0, -F.H, 0, F.H);
    gr.addColorStop(0, P.back); gr.addColorStop(0.32, color); gr.addColorStop(0.58, color);
    gr.addColorStop(0.8, P.belly); gr.addColorStop(1, P.belly);
    g.fillStyle = gr; g.fill();

    g.save();
    smooth(g, pts); g.clip();
    drawMarks(g, shape, pat, name, P, R);
    drawScales(g, F);
    const sheen = g.createLinearGradient(0, -F.H * 0.7, 0, -F.H * 0.1);
    sheen.addColorStop(0, 'rgba(255,255,255,0)'); sheen.addColorStop(0.55, 'rgba(255,255,255,0.26)'); sheen.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sheen; g.fillRect(-40, -F.H * 0.7, 80, F.H * 0.6);
    if (F.lateral) { // 側線
      g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 0.7; g.setLineDash([1.2, 1.2]);
      g.beginPath();
      for (let x = F.gill - 2; x >= F.tail.x + 2; x -= 2) { const y = profY(F.top, x) * 0.36; x === F.gill - 2 ? g.moveTo(x, y) : g.lineTo(x, y); }
      g.stroke(); g.setLineDash([]);
    }
    smooth(g, pts); // 縁をすこし暗くして丸みを出す
    g.lineWidth = 6; g.strokeStyle = 'rgba(0,10,30,0.2)'; g.stroke();
    g.restore();

    // 腹びれ・胸びれ
    if (F.pelvic) drawPelvic(g, F, F.pelvic, P);
    if (F.pect) drawPect(g, S.bigPect ? { x: F.pect.x, y: F.pect.y, len: F.pect.len * (S.bigPect === true ? 1.8 : S.bigPect) } : F.pect, P);

    // エラぶた
    const gry = Math.abs(profY(F.top, F.gill)) * 0.85;
    g.strokeStyle = 'rgba(0,10,30,0.42)'; g.lineWidth = 1.1;
    g.beginPath(); g.ellipse(F.gill + 2.5, 0.5, 5.5, gry, 0, Math.PI * 0.5 + 0.25, Math.PI * 1.5 - 0.25); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.22)'; g.lineWidth = 0.8;
    g.beginPath(); g.ellipse(F.gill + 3.8, 0.5, 5.5, gry * 0.9, 0, Math.PI * 0.5 + 0.35, Math.PI * 1.5 - 0.35); g.stroke();

    // 口と鼻の穴
    if (F.mouth) {
      const m = F.mouth;
      g.strokeStyle = 'rgba(20,8,10,0.75)'; g.lineWidth = 0.9;
      g.beginPath(); g.moveTo(m.x, m.y - 0.6); g.quadraticCurveTo(m.x - m.len * 0.5, m.y + 1.4, m.x - m.len, m.y + 0.6); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 0.6;
      g.beginPath(); g.moveTo(m.x, m.y + 0.2); g.quadraticCurveTo(m.x - m.len * 0.5, m.y + 2.2, m.x - m.len * 0.8, m.y + 1.5); g.stroke();
      g.fillStyle = 'rgba(0,0,0,0.45)'; dot(g, m.x - 3.2, m.y - 3.8, 0.6);
    }
    // 目
    drawEye(g, F.eye.x, F.eye.y, F.eye.r, S.eye || '#e9c35a');
    if (F.eye2) drawEye(g, F.eye2.x, F.eye2.y, F.eye2.r, S.eye || '#e9c35a');
  }

  // --- サメ・シュモクザメ ---
  function drawShark(g, shape, color, pat, name) {
    const S = SPEC[name] || {};
    const P = palette(color, S);
    const R = rng(hash(name + '|' + color + '|' + shape));
    const hammer = shape === 'hammer';
    const top = hammer
      ? [[28, 0], [22, -6], [8, -11], [-8, -11], [-22, -7], [-34, -3]]
      : [[40, 1], [34, -3], [24, -8], [8, -12], [-8, -11], [-22, -7], [-34, -3]];
    const bot = hammer
      ? [[-34, 3], [-22, 6], [-8, 9], [8, 10], [20, 7], [26, 3]]
      : [[-34, 3], [-22, 6], [-8, 9], [8, 10], [24, 7], [34, 3.5]];
    const finG = g.createLinearGradient(0, -30, 0, 0);
    finG.addColorStop(0, P.back); finG.addColorStop(1, color);

    // 尾（上の葉が長い）
    g.fillStyle = finG;
    g.beginPath(); g.moveTo(-30, -2.5);
    g.quadraticCurveTo(-42, -9, -58, -27); g.quadraticCurveTo(-48, -8, -45, 0);
    g.quadraticCurveTo(-47, 6, -53, 14); g.quadraticCurveTo(-41, 7, -30, 3); g.closePath(); g.fill();
    // 第二背びれ・尻びれ
    g.beginPath(); g.moveTo(-21, -7); g.lineTo(-26, -15); g.lineTo(-30, -4.5); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(-22, 6); g.lineTo(-27, 12); g.lineTo(-30, 3); g.closePath(); g.fill();
    // 第一背びれ
    g.beginPath(); g.moveTo(12, -10.5); g.quadraticCurveTo(10, -22, 1, -32); g.quadraticCurveTo(0, -20, -6, -10); g.closePath(); g.fill();

    // 体（背とお腹がくっきり分かれる）
    smooth(g, top.concat(bot));
    const gr = g.createLinearGradient(0, -13, 0, 13);
    gr.addColorStop(0, P.back); gr.addColorStop(0.35, color); gr.addColorStop(0.56, color);
    gr.addColorStop(0.62, '#edf2f5'); gr.addColorStop(1, '#f7fafb');
    g.fillStyle = gr; g.fill();
    g.save();
    smooth(g, top.concat(bot)); g.clip();
    if (pat === 'spot') {
      const light = name === 'ジンベエザメ';
      for (let i = 0; i < 26; i++) {
        g.fillStyle = light ? 'rgba(255,255,255,0.8)' : 'rgba(40,30,10,' + (0.35 + R() * 0.3).toFixed(2) + ')';
        dot(g, -30 + R() * 56, -10 + R() * 12, 0.8 + R() * 1.2);
      }
      if (light) { g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 0.8; for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(-26 + k * 11, -12); g.lineTo(-26 + k * 11, 0); g.stroke(); } }
    }
    const sheen = g.createLinearGradient(0, -10, 0, -2);
    sheen.addColorStop(0, 'rgba(255,255,255,0)'); sheen.addColorStop(0.5, 'rgba(255,255,255,0.22)'); sheen.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sheen; g.fillRect(-40, -10, 80, 8);
    smooth(g, top.concat(bot)); g.lineWidth = 6; g.strokeStyle = 'rgba(0,10,30,0.2)'; g.stroke();
    g.restore();

    // 胸びれ・腹びれ
    g.fillStyle = finG;
    g.beginPath(); g.moveTo(16, 5); g.quadraticCurveTo(10, 16, -4, 26); g.quadraticCurveTo(-2, 12, -4, 6); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(-8, 9); g.lineTo(-18, 15); g.lineTo(-17, 8); g.closePath(); g.fill();

    const hx = hammer ? 27 : 38;
    if (hammer) { // ハンマー形の頭
      const hg = g.createLinearGradient(0, -17, 0, 17);
      hg.addColorStop(0, P.back); hg.addColorStop(0.4, color); hg.addColorStop(0.6, '#edf2f5'); hg.addColorStop(1, '#f7fafb');
      g.fillStyle = hg;
      g.beginPath(); g.ellipse(27, 0, 4.6, 16.5, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(0,10,30,0.2)'; g.beginPath(); g.ellipse(25.5, 0, 2.6, 15, 0, 0, Math.PI * 2); g.fill();
      [-1, 1].forEach(s => { g.fillStyle = '#05080c'; dot(g, 28.5, s * 15.2, 2.1); g.fillStyle = 'rgba(255,255,255,0.9)'; dot(g, 28, s * 15.2 - 0.8, 0.7); });
    } else {
      g.fillStyle = '#05080c'; dot(g, 27, -3, 1.8);
      g.fillStyle = 'rgba(255,255,255,0.9)'; dot(g, 26.5, -3.7, 0.6);
    }
    // 口（歯）とエラあな
    g.strokeStyle = 'rgba(10,15,25,0.75)'; g.lineWidth = 0.9;
    g.beginPath(); g.moveTo(hx - 1, 3.6); g.quadraticCurveTo(hx - 8, 7.4, hx - 15, 5.4); g.stroke();
    g.fillStyle = '#ffffff';
    for (let i = 0; i < 5; i++) { const tx = hx - 4 - i * 2.4; g.beginPath(); g.moveTo(tx, 5.3 + i * 0.1); g.lineTo(tx - 1, 5.3 + i * 0.1); g.lineTo(tx - 0.5, 7); g.closePath(); g.fill(); }
    g.strokeStyle = 'rgba(0,10,30,0.4)'; g.lineWidth = 0.9;
    for (let i = 0; i < 5; i++) { const gx = (hammer ? 14 : 18) - i * 3; g.beginPath(); g.moveTo(gx, -6); g.quadraticCurveTo(gx - 1.5, -1, gx - 0.5, 4); g.stroke(); }
  }

  // --- エイ（上から見た姿）---
  function drawRay(g, color, pat, name) {
    const P = palette(color, SPEC[name]);
    const R = rng(hash(name + '|' + color));
    const tw = Math.sin(time * 5) * 4;
    g.lineCap = 'round';
    g.strokeStyle = P.back; // 先へいくほど細くなる尾
    const tailPt = t => [(1 - t) * (1 - t) * -20 + 2 * (1 - t) * t * -40 + t * t * -62, 2 * (1 - t) * t * tw * 0.5 + t * t * tw];
    for (let k = 0; k < 16; k++) {
      const a = tailPt(k / 16), b = tailPt((k + 1) / 16);
      g.lineWidth = 3.4 * (1 - k / 16) + 0.6;
      g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
    }
    const bp = tailPt(0.42);
    g.fillStyle = P.dark; g.beginPath(); g.moveTo(bp[0] + 3, bp[1] - 1.4); g.lineTo(bp[0] - 7, bp[1] - 0.2); g.lineTo(bp[0] + 3, bp[1] + 1.4); g.closePath(); g.fill(); // 尾のトゲ

    const wing = () => {
      g.beginPath(); g.moveTo(36, 0); g.quadraticCurveTo(16, -36, -22, -7);
      g.quadraticCurveTo(-27, 0, -22, 7); g.quadraticCurveTo(16, 36, 36, 0); g.closePath();
    };
    wing();
    const gr = g.createRadialGradient(6, 0, 2, 4, 0, 40);
    gr.addColorStop(0, P.belly); gr.addColorStop(0.45, color); gr.addColorStop(1, P.back);
    g.fillStyle = gr; g.fill();
    g.save(); wing(); g.clip();
    g.strokeStyle = 'rgba(0,10,30,0.16)'; g.lineWidth = 0.6; // 胸びれの筋
    for (let i = -7; i <= 7; i++) { g.beginPath(); g.moveTo(-12, i * 0.8); g.quadraticCurveTo(10, i * 3.4, 30 - Math.abs(i) * 2, i * 4.3); g.stroke(); }
    if (pat === 'spot') {
      for (let i = 0; i < 28; i++) {
        g.fillStyle = 'rgba(255,255,255,' + (0.45 + R() * 0.3).toFixed(2) + ')';
        dot(g, -18 + R() * 48, -22 + R() * 44, 0.7 + R() * 1.3);
      }
    }
    g.fillStyle = 'rgba(255,255,255,0.16)'; g.beginPath(); g.ellipse(6, -2, 16, 6, 0, 0, Math.PI * 2); g.fill();
    wing(); g.lineWidth = 6; g.strokeStyle = 'rgba(0,10,30,0.22)'; g.stroke();
    g.restore();
    [-1, 1].forEach(s => { // 目の盛り上がりと噴水孔
      g.fillStyle = P.dark; g.beginPath(); g.ellipse(22, s * 5.6, 3.2, 3.2, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#e9c35a'; dot(g, 22.4, s * 5.6, 2.1);
      g.fillStyle = '#05080c'; dot(g, 22.8, s * 5.6, 1.2);
      g.fillStyle = 'rgba(255,255,255,0.9)'; dot(g, 22, s * 5.6 - 0.7, 0.5);
      g.fillStyle = 'rgba(0,10,30,0.45)'; g.beginPath(); g.ellipse(14, s * 8, 2.1, 1.1, 0.3 * s, 0, Math.PI * 2); g.fill();
    });
  }

  // --- ウナギ型（ウツボ・アナゴ・タチウオなど）---
  const EEL = {
    'ウツボ': { w: 15, head: 11, spots: true, jaw: true },
    'ギンポ': { w: 8, head: 7 }, 'アナゴ': { w: 10, head: 8 }, 'ハモ': { w: 12, head: 10, jaw: true },
    'タチウオ': { w: 12, head: 8, silver: true },
    'リュウグウノツカイ': { w: 15, head: 10, silver: true, crest: '#e23a3a' },
  };
  function drawEel(g, color, pat, name) {
    const E = EEL[name] || { w: 12, head: 9 };
    const P = palette(color, SPEC[name]);
    const R = rng(hash(name + '|' + color));
    const pts = [];
    for (let px = -46; px <= 24; px += 2) pts.push([px, Math.sin(px * 0.14 + time * 6) * 5]);
    const N = pts.length;
    const wAt = i => E.w * (0.16 + 0.84 * Math.sin(Math.min(1, (i / (N - 1)) * 1.4) * Math.PI / 2));
    g.lineCap = 'round'; g.lineJoin = 'round';

    // 背びれ（体の上を細長くおおう）
    g.fillStyle = E.crest || P.fin;
    g.beginPath();
    for (let i = 0; i < N; i++) { const y = pts[i][1] - wAt(i) / 2 - (E.crest ? 7 : 3.4) * Math.min(1, i / 8); i === 0 ? g.moveTo(pts[i][0], y) : g.lineTo(pts[i][0], y); }
    for (let i = N - 1; i >= 0; i--) g.lineTo(pts[i][0], pts[i][1] - wAt(i) / 2 + 0.5);
    g.closePath(); g.fill();

    const pass = (scale, dy, col) => {
      g.strokeStyle = col;
      for (let i = 0; i < N - 1; i++) {
        g.lineWidth = wAt(i) * scale;
        g.beginPath(); g.moveTo(pts[i][0], pts[i][1] + wAt(i) * dy); g.lineTo(pts[i + 1][0], pts[i + 1][1] + wAt(i + 1) * dy); g.stroke();
      }
    };
    pass(1, 0, E.silver ? 'hsl(215,14%,60%)' : P.back);
    pass(0.8, 0.02, E.silver ? 'hsl(210,16%,82%)' : color);
    pass(0.36, 0.22, E.silver ? 'rgba(255,255,255,0.8)' : 'hsla(45,40%,80%,0.55)');
    pass(0.12, -0.28, 'rgba(255,255,255,0.35)');
    if (E.spots || pat === 'spot') {
      for (let i = 4; i < N - 3; i += 3) {
        g.fillStyle = 'rgba(30,20,5,' + (0.35 + R() * 0.3).toFixed(2) + ')';
        dot(g, pts[i][0] + R() * 2 - 1, pts[i][1] + (R() - 0.5) * wAt(i) * 0.5, 0.9 + R() * 1.3);
      }
    }
    // 頭
    const hp = pts[N - 1], hw = wAt(N - 1);
    const hx = hp[0] + E.head * 0.3, hy = hp[1];
    const hg = g.createLinearGradient(0, hy - hw / 2, 0, hy + hw / 2);
    hg.addColorStop(0, E.silver ? 'hsl(215,14%,60%)' : P.back); hg.addColorStop(0.45, E.silver ? 'hsl(210,16%,82%)' : color); hg.addColorStop(1, P.belly);
    g.fillStyle = hg;
    g.beginPath(); g.ellipse(hx, hy, E.head, hw * 0.55, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(15,8,5,0.75)'; g.lineWidth = 0.9; // 口
    g.beginPath(); g.moveTo(hx + E.head - 0.5, hy + hw * 0.08); g.quadraticCurveTo(hx + E.head * 0.2, hy + hw * 0.3, hx - E.head * 0.5, hy + hw * 0.18); g.stroke();
    if (E.jaw) { // するどい歯
      g.fillStyle = '#fff';
      for (let i = 0; i < 4; i++) { const tx = hx + E.head * 0.75 - i * 2.2; g.beginPath(); g.moveTo(tx, hy + hw * 0.12 + i * 0.12); g.lineTo(tx - 0.9, hy + hw * 0.12 + i * 0.12); g.lineTo(tx - 0.4, hy + hw * 0.12 + 1.8); g.closePath(); g.fill(); }
    }
    drawEye(g, hx + E.head * 0.32, hy - hw * 0.14, Math.max(1.8, E.head * 0.24), '#e9c35a');
    g.fillStyle = 'rgba(0,0,0,0.5)'; dot(g, hx + E.head * 0.78, hy - hw * 0.25, 0.7);
  }

  function drawRealFish(g, shape, color, pat, name) {
    g.lineJoin = 'round'; g.lineCap = 'round';
    if (shape === 'eel') return drawEel(g, color, pat, name);
    if (shape === 'ray') return drawRay(g, color, pat, name);
    if (shape === 'shark' || shape === 'hammer') return drawShark(g, shape, color, pat, name);
    let F = FAM[shape] || FAM.normal;
    if (shape === 'round' && (name === 'スズメダイ' || name === 'チョウチョウウオ')) F = FAM.disc;
    return drawBony(g, F, shape, color, pat, name);
  }

  function addOutline(c) {
    const t = document.createElement('canvas');
    t.width = c.width; t.height = c.height;
    const tg = t.getContext('2d');
    tg.drawImage(c, 0, 0);
    tg.globalCompositeOperation = 'source-atop';
    tg.fillStyle = 'rgba(8,28,60,0.7)';
    tg.fillRect(0, 0, t.width, t.height);
    const g = c.getContext('2d');
    g.globalCompositeOperation = 'destination-over';
    for (let a = 0; a < 8; a++) g.drawImage(t, Math.cos(a * Math.PI / 4) * 1.6, Math.sin(a * Math.PI / 4) * 1.6);
    g.globalCompositeOperation = 'source-over';
  }

  function getSprite(color, shape, pat, name) {
    // くねくね動く魚（ウツボ・エイ）だけ、動きの12コマ分を別々に用意する
    const period = shape === 'eel' ? 1.0472 : shape === 'ray' ? 1.2566 : 0;
    const frame = period ? Math.floor((time % period) / period * 12) : 0;
    const key = color + '|' + shape + '|' + (pat || '') + '|' + (name || '') + '|' + frame;
    if (spriteCache[key]) return spriteCache[key];

    const c = document.createElement('canvas');
    c.width = SPR_W * SPR_S; c.height = SPR_H * SPR_S;
    const g = c.getContext('2d');
    const prevCtx = ctx, prevTime = time;
    ctx = g;
    if (period) time = frame * period / 12;
    try {
      g.save();
      g.scale(SPR_S, SPR_S);
      g.translate(SPR_OX, SPR_OY);
      drawRealFish(g, shape, color, pat, name);
      g.restore();
    } finally { ctx = prevCtx; time = prevTime; }
    addOutline(c);
    spriteCache[key] = c;
    return c;
  }

  function drawFish(x, y, scale, color, dir, shape = 'normal', pat = null, name = '') {
    const spr = getSprite(color, shape, pat, name);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(dir * scale, scale);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(spr, -SPR_OX, -SPR_OY, SPR_W, SPR_H);
    ctx.restore();
  }

  // 別のキャンバス（図鑑カード）に魚を描く
  function drawFishOn(g, x, y, scale, color, dir, shape, pat, name) {
    const prev = ctx; ctx = g;
    try { drawFish(x, y, scale, color, dir, shape, pat, name); } finally { ctx = prev; }
  }

  function renderZukan() {
    document.getElementById('zukanCount').textContent = zukanGot() + ' / ' + zukanTotal();

    const tabs = document.getElementById('zukanTabs');
    tabs.innerHTML = '';
    ZUKAN_TABS.forEach(([key, label]) => {
      const list = zukanList(key);
      const got = list.filter(e => zukan[e.sp.name] > 0).length;
      const b = document.createElement('button');
      b.textContent = label + ' ' + got + '/' + list.length;
      if (key === zukanTab) b.className = 'active';
      b.onclick = () => { zukanTab = key; renderZukan(); };
      tabs.appendChild(b);
    });

    const grid = document.getElementById('zukanGrid');
    grid.innerHTML = '';
    grid.scrollTop = 0;
    zukanList(zukanTab).forEach(({ kind, sp, rare }) => {
      const have = zukan[sp.name] > 0;
      const card = document.createElement('div');
      card.className = 'zcard ' + (have ? 'got' : 'none') + (rare ? ' rare' : '');
      card.onclick = () => openZukanDetail(kind, sp, rare, have);

      const c = document.createElement('canvas');
      c.width = 120; c.height = 72;
      const g = c.getContext('2d');
      drawFishOn(g, 56, 36, ZK_SCALE[kind], sp.color, 1, sp.shape, have ? sp.pat : null, sp.name);
      if (!have) { // 未登録はシルエット表示
        g.globalCompositeOperation = 'source-atop';
        g.fillStyle = '#0d2f57';
        g.fillRect(0, 0, c.width, c.height);
      }
      card.appendChild(c);

      const n = document.createElement('div');
      n.className = 'zn';
      n.textContent = have ? sp.name : '？？？';
      card.appendChild(n);

      const sub = document.createElement('div');
      sub.className = have ? 'zc' : '';
      sub.textContent = have
        ? FISH[kind].label + '・' + (sp.points || FISH[kind].points) + '点・' + zukan[sp.name] + '匹'
        : '未登録';
      card.appendChild(sub);

      grid.appendChild(card);
    });
  }

  // 魚の詳細（大きな絵と説明）
  function openZukanDetail(kind, sp, rare, have) {
    const box = document.getElementById('zukanDetail');
    box.className = 'zdetail' + (rare ? ' rare' : '');

    const c = document.getElementById('zdCanvas');
    const g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    drawFishOn(g, 140, 90, ZK_SCALE[kind] * 2.1, sp.color, 1, sp.shape, have ? sp.pat : null, sp.name);
    if (!have) {
      g.globalCompositeOperation = 'source-atop';
      g.fillStyle = '#0d2f57';
      g.fillRect(0, 0, c.width, c.height);
      g.globalCompositeOperation = 'source-over';
    }

    document.getElementById('zdName').textContent = have ? sp.name : '？？？';

    const tags = document.getElementById('zdTags');
    tags.innerHTML = '';
    const tagTexts = have
      ? [DEPTH_LABEL[kind], (rare ? '幻' : FISH[kind].label + 'サイズ'), (sp.points || FISH[kind].points) + '点', zukan[sp.name] + '匹釣った']
      : [DEPTH_LABEL[kind] + 'にいる', (rare ? '幻の魚' : FISH[kind].label + 'サイズ')];
    tagTexts.forEach(t => {
      const s = document.createElement('span');
      s.textContent = t;
      tags.appendChild(s);
    });

    document.getElementById('zdText').textContent = have
      ? (DESC[sp.name] || '')
      : 'まだ釣ったことがない魚。' + DEPTH_LABEL[kind] + 'をねらって釣り上げると、くわしい説明が見られるようになる。';
  }

  function openZukan() {
    renderZukan();
    document.getElementById('zukanScreen').classList.remove('hidden');
  }

  function rodTip() {
    const sh = shake > 0 ? Math.sin(time * 60) * 3 * (shake / 0.4) : 0;
    const bend = (state === 'reel') ? Math.sin(time * 14) * 2 : 0;
    return { x: 345 + sh, y: 92 + sh + bend };
  }

  function drawScene() {
    drawSky();

    // 海（深さで青が濃くなる）
    const sea = ctx.createLinearGradient(0, WATER, 0, H);
    sea.addColorStop(0, '#5ab8f4'); sea.addColorStop(0.25, '#2a88d6');
    sea.addColorStop(0.6, '#14589f'); sea.addColorStop(1, '#082a58');
    ctx.fillStyle = sea; ctx.fillRect(0, WATER, W, H - WATER);

    drawLightRays();
    drawSeabed();
    // 背景の魚（遠くにいる影）
    ambient.forEach(a => drawFishFlat(a.x, a.y, FISH[a.kind].scale * 0.85, 'rgba(200,230,255,0.20)', a.dir, a.sp.shape));
    drawBubbles();

    drawBoatAndAngler();
    drawLineAndHook();
    drawSurface();
  }

  function drawSky() {
    const sky = ctx.createLinearGradient(0, 0, 0, WATER);
    sky.addColorStop(0, '#4f9fe6'); sky.addColorStop(0.7, '#a9d8f8'); sky.addColorStop(1, '#eaf6ff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, WATER);

    // 太陽（まわりに光のにじみ）
    const sg = ctx.createRadialGradient(700, 66, 2, 700, 66, 150);
    sg.addColorStop(0, 'rgba(255,255,235,1)'); sg.addColorStop(0.2, 'rgba(255,246,196,1)');
    sg.addColorStop(0.24, 'rgba(255,240,170,0.5)'); sg.addColorStop(1, 'rgba(255,240,170,0)');
    ctx.fillStyle = sg; ctx.fillRect(520, 0, 280, WATER);

    // 遠くの島
    ctx.fillStyle = 'rgba(108,148,190,0.55)';
    ctx.beginPath(); ctx.moveTo(420, WATER); ctx.lineTo(455, 170); ctx.lineTo(485, 176); ctx.lineTo(530, 150);
    ctx.lineTo(575, 172); ctx.lineTo(610, WATER); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(138,172,208,0.5)';
    ctx.beginPath(); ctx.moveTo(610, WATER); ctx.lineTo(650, 176); ctx.lineTo(690, 168); ctx.lineTo(740, WATER); ctx.closePath(); ctx.fill();

    // 水平線のもや
    const hz = ctx.createLinearGradient(0, WATER - 40, 0, WATER);
    hz.addColorStop(0, 'rgba(255,255,255,0)'); hz.addColorStop(1, 'rgba(255,255,255,0.55)');
    ctx.fillStyle = hz; ctx.fillRect(0, WATER - 40, W, 40);

    // 雲（ゆっくり流れる）
    [[80, 52, 1.0, 5], [330, 34, 0.75, 3], [560, 78, 0.9, 4]].forEach(([x0, cy, s, v]) => {
      const cx = ((x0 + time * v) % (W + 240)) - 120;
      ctx.fillStyle = 'rgba(255,255,255,0.94)';
      [[0, 0, 22], [26, 4, 18], [-26, 6, 16], [12, -10, 16], [-8, -8, 14]].forEach(([dx, dy, r]) => {
        ctx.beginPath(); ctx.arc(cx + dx * s, cy + dy * s, r * s, 0, Math.PI * 2); ctx.fill();
      });
      ctx.fillStyle = 'rgba(165,192,228,0.30)';
      ctx.beginPath(); ctx.ellipse(cx, cy + 14 * s, 38 * s, 6 * s, 0, 0, Math.PI * 2); ctx.fill();
    });

    // カモメ
    [[250, 70, 0], [290, 52, 1.7]].forEach(([gx0, gy, ph]) => {
      const gx = ((gx0 + time * 18 + ph * 40) % (W + 60)) - 30;
      const fl = Math.sin(time * 6 + ph) * 3;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(gx - 9, gy + fl); ctx.quadraticCurveTo(gx - 4, gy - 5, gx, gy);
      ctx.quadraticCurveTo(gx + 4, gy - 5, gx + 9, gy + fl); ctx.stroke();
    });
  }

  // 水面から差し込む光の筋
  function drawLightRays() {
    for (let i = 0; i < 6; i++) {
      const x0 = 80 + i * 140 + Math.sin(time * 0.5 + i) * 18;
      const g = ctx.createLinearGradient(x0, WATER, x0 - 70, H);
      g.addColorStop(0, 'rgba(255,255,255,0.15)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(x0 - 16, WATER); ctx.lineTo(x0 + 22, WATER);
      ctx.lineTo(x0 - 40, H); ctx.lineTo(x0 - 130, H); ctx.closePath(); ctx.fill();
    }
  }

  // 海底（砂・岩・ゆれる海藻）
  function drawSeabed() {
    const base = H - 30;
    const sand = ctx.createLinearGradient(0, base - 8, 0, H);
    sand.addColorStop(0, '#b9a373'); sand.addColorStop(1, '#6e5f3c');
    ctx.fillStyle = sand;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) ctx.lineTo(x, base + Math.sin(x * 0.02) * 5 + Math.sin(x * 0.07) * 2);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();

    // 岩
    [[52, base + 4, 38, 17], [742, base + 6, 44, 20], [380, base + 10, 30, 12]].forEach(([rx, ry, w, h]) => {
      const rg = ctx.createLinearGradient(0, ry - h, 0, ry + h);
      rg.addColorStop(0, '#6d7b88'); rg.addColorStop(1, '#2e3a46');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.ellipse(rx, ry, w, h, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.ellipse(rx - w * 0.25, ry - h * 0.55, w * 0.4, h * 0.22, -0.2, 0, Math.PI * 2); ctx.fill();
    });

    // 海藻
    [18, 70, 112, 300, 330, 560, 600, 690, 770].forEach((sx, i) => {
      ctx.lineCap = 'round';
      for (let k = 0; k < 3; k++) {
        const hgt = 38 + ((i * 13 + k * 17) % 30);
        const sway = Math.sin(time * 1.6 + i + k) * 7;
        const x0 = sx + (k - 1) * 7;
        ctx.strokeStyle = k === 1 ? '#2f9a62' : '#1f7a52'; ctx.lineWidth = 4 - k * 0.4;
        ctx.beginPath(); ctx.moveTo(x0, base + 8);
        ctx.quadraticCurveTo(x0 + sway * 0.4, base - hgt * 0.5, x0 + sway, base - hgt); ctx.stroke();
      }
    });
  }

  function drawBubbles() {
    bubbles.forEach(b => {
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, Math.max(0.6, b.r * 0.22), 0, Math.PI * 2); ctx.fill();
    });
  }

  function waveY(x, k) {
    return WATER + Math.sin(x * 0.04 + time * 2 + k) * 3 + Math.sin(x * 0.013 + time * 1.2 + k * 2) * 2;
  }

  // 水面（船底や釣り糸の水中部分を青くかすませ、波とさざ波を重ねる）
  function drawSurface() {
    const wg = ctx.createLinearGradient(0, WATER - 6, 0, WATER + 44);
    wg.addColorStop(0, 'rgba(60,150,230,0.78)'); wg.addColorStop(1, 'rgba(60,150,230,0.28)');
    ctx.fillStyle = wg;
    ctx.beginPath(); ctx.moveTo(0, waveY(0, 0));
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, waveY(x, 0));
    ctx.lineTo(W, WATER + 44); ctx.lineTo(0, WATER + 44); ctx.closePath(); ctx.fill();

    [[0, 'rgba(255,255,255,0.35)', 2, 0], [1.7, 'rgba(255,255,255,0.75)', 2.5, 2]].forEach(([k, col, lw, off]) => {
      ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'butt'; ctx.beginPath();
      for (let x = 0; x <= W; x += 6) { const y = waveY(x, k) + off; x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.stroke();
    });

    // 波頭のきらめき
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 22; i++) {
      const x = (i * 37 + time * 14) % W;
      ctx.fillRect(x, waveY(x, 1.7) + 3, 6 + (i % 3) * 3, 1.5);
    }

    // 釣り糸が水に入る場所の波紋
    if (hookY > WATER - 4) {
      for (let i = 0; i < 3; i++) {
        const p = (time * 0.8 + i / 3) % 1;
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.55 * (1 - p)).toFixed(3) + ')'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(HOOK_X, WATER + 1, 6 + p * 34, 2 + p * 7, 0, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }

  function drawBoatAndAngler() {
    const bob = Math.sin(time * 2) * 2;
    ctx.save(); ctx.translate(0, bob);
    // 船体（木の板・白いライン・ふち・浮き輪）
    const hullPath = () => {
      ctx.beginPath(); ctx.moveTo(108, 158); ctx.lineTo(352, 158); ctx.lineTo(322, 210); ctx.lineTo(143, 210); ctx.closePath();
    };
    const hg2 = ctx.createLinearGradient(0, 158, 0, 210);
    hg2.addColorStop(0, '#c9683c'); hg2.addColorStop(1, '#7e3519');
    hullPath(); ctx.fillStyle = hg2; ctx.fill();
    ctx.save(); hullPath(); ctx.clip();
    ctx.lineWidth = 1.2;
    for (let yy = 170; yy < 210; yy += 9) {
      ctx.strokeStyle = 'rgba(0,0,0,0.20)'; ctx.beginPath(); ctx.moveTo(100, yy); ctx.lineTo(360, yy); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.beginPath(); ctx.moveTo(100, yy + 1.2); ctx.lineTo(360, yy + 1.2); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.30)'; ctx.fillRect(100, 196, 260, 20);
    ctx.restore();
    ctx.fillStyle = '#f5f0e6'; ctx.fillRect(118, 166, 226, 5);
    ctx.fillStyle = '#6e2f16'; ctx.fillRect(104, 154, 252, 6);
    ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillRect(104, 154, 252, 1.5);
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(176, 185, 9, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#e03a3a';
    for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(176, 185, 9, k * Math.PI / 2, k * Math.PI / 2 + 0.8); ctx.stroke(); }
    // 釣り人：脚とブーツ
    ctx.fillStyle = '#2b3a55'; ctx.fillRect(240, 142, 10, 16); ctx.fillRect(254, 142, 10, 16);
    ctx.fillStyle = '#1c2430'; ctx.fillRect(238, 156, 13, 6); ctx.fillRect(254, 156, 14, 6);
    // 胴体（シャツとライフジャケット）
    const shirt = ctx.createLinearGradient(238, 0, 266, 0);
    shirt.addColorStop(0, '#2c62c8'); shirt.addColorStop(1, '#4a8af0');
    ctx.fillStyle = shirt; ctx.fillRect(238, 100, 28, 46);
    ctx.fillStyle = '#f2872a'; ctx.fillRect(240, 103, 24, 30);
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(251, 103, 2, 30);
    ctx.fillStyle = '#c96a16'; ctx.fillRect(240, 120, 24, 2);
    ctx.fillStyle = '#3b2a1e'; ctx.fillRect(238, 140, 28, 4);
    // 首と顔
    ctx.fillStyle = '#e8b98c'; ctx.fillRect(250, 94, 8, 8);
    const face = ctx.createRadialGradient(251, 84, 2, 254, 88, 16);
    face.addColorStop(0, '#fbdcb8'); face.addColorStop(1, '#e3b084');
    ctx.fillStyle = face; ctx.beginPath(); ctx.arc(254, 88, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e3b084'; ctx.beginPath(); ctx.arc(241, 89, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#233'; ctx.beginPath(); ctx.arc(260, 87, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#5a3a22'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(257, 83.5); ctx.lineTo(263, 83); ctx.stroke();
    ctx.strokeStyle = '#c98c66'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(265, 88); ctx.lineTo(268, 91); ctx.lineTo(265, 92); ctx.stroke();
    ctx.strokeStyle = '#a0522d'; ctx.beginPath(); ctx.arc(259, 92, 3.5, 0.2, 1.3); ctx.stroke();
    // バケットハット
    ctx.fillStyle = '#d9b36a'; ctx.beginPath(); ctx.arc(254, 82, 14.5, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#b8914a'; ctx.beginPath(); ctx.ellipse(256, 82.5, 21, 4.2, -0.05, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a07c3a'; ctx.fillRect(240, 79, 29, 2.5);
    // 腕
    const tip = rodTip();
    const P0 = { x: 272, y: 122 }, P1 = { x: 310, y: 100 };
    ctx.strokeStyle = '#2c62c8'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(260, 108); ctx.lineTo(276, 120); ctx.stroke();
    ctx.strokeStyle = '#e8b98c'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(276, 120); ctx.lineTo(284, 123); ctx.stroke();
    // 竿（コルクのグリップ・先細りの竿・ガイド）とリール
    ctx.strokeStyle = '#c9a25a'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(266, 126); ctx.lineTo(280, 121); ctx.stroke();
    const rodGrad = ctx.createLinearGradient(P0.x, P0.y, tip.x, tip.y);
    rodGrad.addColorStop(0, '#3a2a1a'); rodGrad.addColorStop(1, '#8a6a42');
    ctx.strokeStyle = rodGrad; ctx.lineWidth = 3.6;
    ctx.beginPath(); ctx.moveTo(P0.x, P0.y); ctx.quadraticCurveTo(P1.x, P1.y, tip.x, tip.y); ctx.stroke();
    ctx.fillStyle = '#9aa4b0'; ctx.beginPath(); ctx.arc(278, 130, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c8d0d8'; ctx.beginPath(); ctx.arc(277, 129, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5a6470'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(278, 130); ctx.lineTo(284, 134); ctx.stroke();
    ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 1;
    [0.35, 0.6, 0.82].forEach(t => {
      const gx = (1 - t) * (1 - t) * P0.x + 2 * (1 - t) * t * P1.x + t * t * tip.x;
      const gy = (1 - t) * (1 - t) * P0.y + 2 * (1 - t) * t * P1.y + t * t * tip.y;
      ctx.beginPath(); ctx.arc(gx, gy + 2, 2, 0, Math.PI * 2); ctx.stroke();
    });
    ctx.restore();
  }

  function drawLineAndHook() {
    const bob = Math.sin(time * 2) * 2;
    const tip = rodTip();
    const tx = tip.x, ty = tip.y + bob;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo((tx + HOOK_X) / 2 - 10, ty + 10, HOOK_X, hookY);
    ctx.stroke();
    // 針
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(HOOK_X, hookY); ctx.lineTo(HOOK_X, hookY + 8);
    ctx.arc(HOOK_X - 5, hookY + 8, 5, 0, Math.PI * 0.9); ctx.stroke();
    // 浮き（水面にあるとき）
    if (hookY <= WATER) {
      ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.arc(HOOK_X, WATER - 2, 5, 0, 7); ctx.fill();
    }
  }

  function drawFishEvents() {
    const sc = FISH[fishKind] ? FISH[fishKind].scale : 1;
    const glow = ['wait', 'reel', 'result'].includes(state) && species.rare;
    if (glow) { ctx.shadowColor = '#fff3a0'; ctx.shadowBlur = 24 + Math.sin(time * 8) * 8; }
    if (state === 'wait') {
      drawFish(fishX, fishY, sc, species.color, -1, species.shape, species.pat, species.name);
    } else if (state === 'reel') {
      const wob = Math.sin(time * 18) * 3;
      drawFish(HOOK_X + 14, targetY + 6 + wob, sc, species.color, -1, species.shape, species.pat, species.name);
    } else if (state === 'result') {
      if (success) drawFish(HOOK_X + 14, hookY + 10, sc, species.color, -1, species.shape, species.pat, species.name);
      else drawFish(fishX, fishY, sc, species.color, 1, species.shape, species.pat, species.name);
    }
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  }

  function text(str, x, y, size, color, align = 'center', weight = 'bold') {
    ctx.font = weight + ' ' + size + 'px "Hiragino Sans","Meiryo","Yu Gothic",sans-serif';
    ctx.textAlign = align; ctx.fillStyle = color; ctx.fillText(str, x, y);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(8,40,90,0.55)';
    roundRect(12, 12, 150, 40, 10); ctx.fill();
    text('スコア ' + score, 24, 39, 20, '#fff', 'left');
    ctx.fillStyle = 'rgba(8,40,90,0.55)'; // text() が塗り色を白にするので、右側の板の色を戻す
    roundRect(W - 162, 12, 150, 40, 10); ctx.fill();
    text('残り ' + casts + ' 投', W - 24, 39, 20, '#fff', 'right');
    // 釣れた魚の履歴
    caughtList.forEach((c, i) => drawFish(34 + i * 38, 76, FISH[c.kind].scale * 0.42, c.sp.color, 1, c.sp.shape, c.sp.pat, c.sp.name));
  }

  function drawGaugeFrame(label) {
    const gx = 160, gy = 462, gw = 480, gh = 30;
    ctx.fillStyle = 'rgba(8,40,90,0.7)';
    roundRect(gx - 20, gy - 38, gw + 40, gh + 54, 14); ctx.fill();
    text(label, W / 2, gy - 14, 17, '#fff');
    return { gx, gy, gw, gh };
  }

  function drawDepthGauge() {
    const { gx, gy, gw, gh } = drawGaugeFrame('クリックで狙う深さを決めよう（右ほど深い）');
    const zones = [['small', 0, 0.40, '浅い：小'], ['medium', 0.40, 0.75, '中間：中'], ['large', 0.75, 1, '深い：大']];
    zones.forEach(([k, a, b, lab]) => {
      ctx.fillStyle = FISH[k].color;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(gx + gw * a, gy, gw * (b - a), gh);
      ctx.globalAlpha = 1;
      text(lab, gx + gw * (a + b) / 2, gy + 21, 14, '#0a2a50');
    });
    drawMarker(gx + gw * gaugePos, gy, gh);
  }

  function drawReelGauge() {
    const f = FISH[fishKind];
    const { gx, gy, gw, gh } = drawGaugeFrame('ヒット！ 緑のゾーンでクリックして引き上げろ！（' + f.label + '）');
    ctx.fillStyle = '#6b7f95'; ctx.fillRect(gx, gy, gw, gh);
    ctx.fillStyle = '#3ddc84'; ctx.fillRect(gx + gw * zoneStart, gy, gw * zoneW, gh);
    drawMarker(gx + gw * gaugePos, gy, gh);
  }

  function drawMarker(x, gy, gh) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 3, gy - 6, 6, gh + 12);
    ctx.strokeStyle = '#0a2a50'; ctx.lineWidth = 1; ctx.strokeRect(x - 3, gy - 6, 6, gh + 12);
  }

  function drawMessages() {
    if (state === 'ready') {
      text('第 ' + (castNo + 1) + ' 投目', W / 2, 250, 30, '#fff');
      text('クリックで投げる準備', W / 2, 288, 20, '#e8f4ff');
    } else if (state === 'depth') {
      drawDepthGauge();
    } else if (state === 'reel') {
      drawReelGauge();
      text('ヒット！', W / 2, 250, 38, '#ffe27a');
    } else if (state === 'wait') {
      text('…アタリを待っている', W / 2, 250, 22, '#e8f4ff');
    } else if (state === 'result') {
      if (success) {
        const f = FISH[fishKind];
        if (species.rare) {
          text('★ 幻の魚！ ' + species.name + ' ゲット！ ★', W / 2, 250, 34, '#fff3a0');
        } else {
          text(species.name + '（' + f.label + '）ゲット！', W / 2, 250, 36, '#ffe27a');
        }
        if (isNew) text('NEW！ 図鑑に登録', W / 2, 284, 20, '#9affc8');
        if (popup) text(popup.text, HOOK_X + 60, 150 - popup.t * 30, 34, '#fff');
      } else {
        text('逃げられた…', W / 2, 250, 36, '#ffd0d0');
      }
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawScene();
    drawFishEvents();
    if (state !== 'title') { drawHUD(); drawMessages(); }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    render();
    // BGM：ヒットして引き上げ中だけ「fish」、それ以外のプレイ中は「calm」、タイトル・結果は無音
    Music.mood(state === 'reel' ? 'fish' : (state === 'title' || state === 'end') ? null : 'calm');
    requestAnimationFrame(loop);
  }

  species = SPECIES.small[0]; fishKind = 'small';
  resetGame();
  state = 'title';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
